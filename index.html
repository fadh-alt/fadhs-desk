<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fadh's Desk</title>
<meta name="description" content="Personal desk for tasks, calendar, timetable, FYP and IDP progress.">
<meta name="theme-color" content="#0d1b38">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fadh's Desk">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<script>window.FYD_PWA=true;</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy greeting band, summary strip, then a two-column desk — work list + projects on the left, calendar + day plan + weekly routine on the right. */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --sunk:#eaeef6; --ink:#0f1f3d; --muted:#56637d; --line:#dbe1ec;
  --accent:#1b2f5e; --accent-ink:#ffffff; --accent-soft:#e3e9f6;
  --navy:#13254a; --on-navy:#ffffff; --on-navy-muted:#b4c1dc; --navy-line:#34497a; --navy-soft:#22386a;
  --side:#0d1b38; --glow1:rgba(86,140,255,.38); --glow2:rgba(140,100,240,.26); --grid-dot:rgba(255,255,255,.13); --scrim-bg:rgba(4,10,26,.55); --cap-bg:rgba(6,14,32,.86);
  --work:#b56f06; --fyp:#2f6fd6; --idp:#11886a; --personal:#c0407a; --src:#7046c8;
  --c1:#c2620d; --c2:#0e8f8a; --c3:#4d8a12; --c4:#2f6fd6; --c5:#7a4fd0; --c6:#a87b00; --c7:#c93d7c;
  --danger:#c23a3a; --danger-soft:#fbe8e8; --ok:#1d8a4e; --ok-soft:#e3f4ea; --warn:#a96a00; --warn-soft:#fbf0dc;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1428; --surface:#111f3b; --sunk:#182a4c; --ink:#eef2fa; --muted:#9fb0cf; --line:#233558;
  --accent:#ffffff; --accent-ink:#0f1f3d; --accent-soft:#1f3463;
  --navy:#152a54; --on-navy:#ffffff; --on-navy-muted:#a9b8d6; --navy-line:#2f4679; --navy-soft:#22396d;
  --side:#07112a;
  --work:#e6a23c; --fyp:#6aa2ff; --idp:#3fc79f; --personal:#ef7fb0; --src:#b79bff;
  --c1:#ff9d5c; --c2:#4fd8cf; --c3:#9bdc4b; --c4:#74a8ff; --c5:#b794ff; --c6:#f2c94c; --c7:#ff7fb0;
  --danger:#ff7b7b; --danger-soft:#3a1d22; --ok:#5fd394; --ok-soft:#173327; --warn:#f0b450; --warn-soft:#382a12;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a1428; --surface:#111f3b; --sunk:#182a4c; --ink:#eef2fa; --muted:#9fb0cf; --line:#233558;
  --accent:#ffffff; --accent-ink:#0f1f3d; --accent-soft:#1f3463;
  --navy:#152a54; --on-navy:#ffffff; --on-navy-muted:#a9b8d6; --navy-line:#2f4679; --navy-soft:#22396d;
  --side:#07112a;
  --work:#e6a23c; --fyp:#6aa2ff; --idp:#3fc79f; --personal:#ef7fb0; --src:#b79bff;
  --c1:#ff9d5c; --c2:#4fd8cf; --c3:#9bdc4b; --c4:#74a8ff; --c5:#b794ff; --c6:#f2c94c; --c7:#ff7fb0;
  --danger:#ff7b7b; --danger-soft:#3a1d22; --ok:#5fd394; --ok-soft:#173327; --warn:#f0b450; --warn-soft:#382a12;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.top .sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px;color:var(--muted)}
.chip-week{font-family:var(--f-mono);font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:999px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--danger);border-color:var(--danger)}

/* greeting band */
.hero{background:var(--navy);color:var(--on-navy)}
.hero-in{max-width:1280px;margin:0 auto;padding-block:28px 26px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.greet{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:640px}
.hero .eyebrow{color:var(--on-navy-muted)}
.hero h1{font-size:34px;color:var(--on-navy)}
.hero .msg{margin:0;font-size:15px;color:var(--on-navy)}
.hero .quote{margin:0;font-size:13px;color:var(--on-navy-muted);font-style:italic}
.hero .sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.hero .chip-week{background:var(--navy-soft);color:var(--on-navy)}
.hero .btn{background:transparent;color:var(--on-navy);border-color:var(--navy-line)}
.hero .btn:hover{border-color:var(--on-navy)}
.hero .btn.primary{background:var(--on-navy);color:var(--navy);border-color:var(--on-navy)}
.hero .btn.ghost{border-color:transparent;color:var(--on-navy-muted)}
.hero .btn.ghost:hover{background:var(--navy-soft);color:var(--on-navy)}

.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:9px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note.info{background:var(--accent-soft);color:var(--accent)}

/* summary */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile .line{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.tile .line b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bar{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.good{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.plain{background:var(--sunk);color:var(--muted)}

/* desk */
.desk{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* area markers */
.a-work{--a:var(--work)} .a-fyp{--a:var(--fyp)} .a-idp{--a:var(--idp)} .a-src{--a:var(--src)} .a-personal{--a:var(--personal)}
.tag{font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--a,var(--muted));border:1px solid currentColor;border-radius:5px;padding:0 5px;white-space:nowrap;line-height:17px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--a,var(--muted));display:inline-block;flex:none}

/* todo */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.quick{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px}
.field{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
.group{display:flex;flex-direction:column}
.group-h{display:flex;align-items:center;gap:8px;padding:8px 2px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.group-h.bad{color:var(--danger)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line)}
.group .row:first-of-type{border-top:none}
.row .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t span.title{overflow-wrap:anywhere}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.row .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.row .meta .due.bad{color:var(--danger);font-weight:600}
.row .meta .due.today{color:var(--accent);font-weight:600}
.row .row-act{display:flex;gap:2px;align-items:center}
.prio{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--danger)}
.check{appearance:none;width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-content:center;margin:0;cursor:pointer;background:transparent}
.check:checked{background:var(--ok);border-color:var(--ok)}
.check:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:translateY(-1px) rotate(-45deg)}
.icon-btn{border:none;background:transparent;color:var(--muted);border-radius:6px;width:28px;height:28px;display:grid;place-items:center}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.empty{color:var(--muted);padding:14px 4px;font-size:13px}

/* projects */
.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.proj{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative;overflow:hidden}
.proj::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--a)}
.proj .ph{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.proj .pct{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;color:var(--a)}
.proj .bar>i{background:var(--a)}
.ms{display:flex;flex-direction:column}
.ms-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:13px}
.ms-row:first-child{border-top:none}
.ms-row .title{overflow-wrap:anywhere}
.ms-row.done .title{color:var(--muted);text-decoration:line-through}
.status{border:none;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.status.todo{background:var(--sunk);color:var(--muted)}
.status.doing{background:var(--warn-soft);color:var(--warn)}
.status.done{background:var(--ok-soft);color:var(--ok)}
.words{display:flex;flex-direction:column;gap:5px;background:var(--sunk);border-radius:8px;padding:9px 10px}
.words .line{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}

/* calendar */
.cal-nav{display:flex;align-items:center;gap:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dow{font-size:11px;text-align:center;color:var(--muted);font-weight:600;padding-bottom:2px;letter-spacing:.04em}
.cell{border:1px solid transparent;background:var(--bg);border-radius:7px;min-height:52px;padding:4px 5px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left}
.cell:hover{border-color:var(--line)}
.cell .n{font-family:var(--f-mono);font-size:12px}
.cell.out{opacity:.4}
.cell.today .n{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 4px}
.cell.sel{border-color:var(--accent);background:var(--accent-soft)}
.cell .dots{display:flex;gap:3px;flex-wrap:wrap}
.cell{min-width:0;overflow:hidden;min-height:74px}
.cell .evs{display:flex;flex-direction:column;gap:2px;width:100%;min-width:0}
.ev{display:block;width:100%;min-width:0;font-size:10.5px;line-height:1.35;padding:0 4px;border-left:2px solid var(--a);border-radius:2px;background:var(--surface);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.sel .ev{background:var(--surface)}
@media (max-width:640px){.cell{min-height:60px;padding:3px}.ev{font-size:9.5px;padding:0 2px}}
.cell .more{font-size:10px;color:var(--muted);font-family:var(--f-mono)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* agenda */
.agenda{display:flex;flex-direction:column}
.ag-row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ag-row:first-child{border-top:none}
.ag-row .time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ag-row .t{display:flex;gap:8px;align-items:center;min-width:0}
.ag-row .t .title{overflow-wrap:anywhere}
.ag-row .kind{font-size:11px;color:var(--muted)}
.ag-row.past{opacity:.55}
.addcal{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px 72px;padding:8px 10px;background:var(--accent-soft);border-radius:8px;font-size:12.5px}
.addcal a{color:var(--ink);font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 9px}
.addcal a:hover{border-color:var(--ink)}
.addcal .hint{color:var(--muted);font-size:11.5px;width:100%}
.icon-btn[aria-expanded="true"]{background:var(--accent-soft);color:var(--ink)}
@media (max-width:640px){.addcal{margin-left:0}}
.ag-row.now{position:relative}
.now-line{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--danger);padding:2px 0}
.now-line::after{content:"";flex:1;height:1px;background:var(--danger)}

/* routines */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wday{background:var(--bg);border-radius:8px;padding:7px;display:flex;flex-direction:column;gap:5px;min-width:0;min-height:70px}
.wday.today{outline:1.5px solid var(--accent)}
.wday .h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rt{border:none;text-align:left;background:var(--surface);border-left:3px solid var(--a);border-radius:4px;padding:3px 5px;font-size:11.5px;line-height:1.3;display:flex;flex-direction:column;min-width:0}
.rt .mono{font-size:10.5px;color:var(--muted)}
.rt span:last-child{overflow-wrap:anywhere}

/* dialog */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(480px, calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto}
dialog::backdrop{background:rgba(10,14,22,.45)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px}
.fl{display:flex;flex-direction:column;gap:4px}
.fl label,.fl .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.fl-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:12.5px;color:var(--ink);font-weight:500}
.dlg-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100vw - 32px)}

@media (max-width:1120px){
  .desk{grid-template-columns:minmax(0,1fr)}
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .projects{grid-template-columns:minmax(0,1fr)}
  .quick{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .quick .field:first-child{grid-column:1 / -1}
  .week{grid-template-columns:minmax(0,1fr)}
  .wday{flex-direction:row;flex-wrap:wrap;align-items:center;min-height:0}
  .wday .h{width:36px}
  .cell{min-height:42px}
  h1{font-size:24px}
}
@media (max-width:420px){ .summary{grid-template-columns:minmax(0,1fr)} }
/* pages + motion */
.tabs-row{flex-basis:100%}
.tabs{display:inline-flex;position:relative;background:var(--navy-soft);border-radius:999px;padding:3px}
.tabs a{position:relative;z-index:1;color:var(--on-navy-muted);text-decoration:none;font-weight:600;font-size:13px;padding:6px 14px;border-radius:999px;transition:color .25s}
.tabs a:hover{color:var(--on-navy)}
.tabs a[aria-current="page"]{color:var(--navy)}
.tabs .ind{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:var(--on-navy);transition:transform .35s cubic-bezier(.3,.7,.2,1),width .35s cubic-bezier(.3,.7,.2,1)}
.view{display:flex;flex-direction:column;gap:18px;min-width:0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ping{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.8);opacity:0}}
.view.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.07s}
.view.enter>*:nth-child(3){animation-delay:.14s}
.view.enter .day{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.14s + var(--i,0)*.06s)}
.view.enter .seg{animation:grow .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.32s + var(--i,0)*.06s)}
.greet.swap h1,.greet.swap .quote{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}

/* timetable */
.tt-now{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.tt-now h2{font-size:20px}
.tt-now .count{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1;text-align:right;font-variant-numeric:tabular-nums}
.tt-now .count small{display:block;font-family:var(--f-body);font-size:11.5px;font-weight:500;color:var(--muted)}
.tt-now .bar{grid-column:1 / -1}
.tt-now .bar>i{background:var(--a,var(--accent));transition:width 1s}
.beacon{position:relative;width:10px;height:10px;border-radius:50%;background:var(--a,var(--accent));flex:none;display:inline-block}
.beacon::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 1.8s ease-out infinite}
.beacon.still::after{display:none}
.tt{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:14px;align-items:start}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.day.today{border-color:var(--accent)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.track{position:relative;height:6px;border-radius:999px;background:var(--sunk)}
.seg{position:absolute;top:0;bottom:0;border-radius:999px;transform-origin:left center}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--danger)}
.track-ends{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:4px}
.cls-list{display:flex;flex-direction:column;gap:2px}
.cls{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:none;background:transparent;padding:8px 6px;border-radius:8px;transition:transform .2s,background .2s}
.cls:hover{background:var(--sunk);transform:translateX(3px)}
.cls.past{opacity:.5}
.cls .time{font-family:var(--f-mono);font-size:12.5px;line-height:1.25;font-variant-numeric:tabular-nums}
.cls .time small{display:block;color:var(--muted);font-size:11px}
.cls .name{display:block;font-weight:600;overflow-wrap:anywhere}
.cls .sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;margin-top:2px}
.cls .code{font-family:var(--f-mono);font-weight:500;color:var(--a)}
.cls .room{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right;max-width:104px;overflow-wrap:anywhere}
.noclass{color:var(--muted);font-size:13px;padding:2px}

/* import */
.imp{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;cursor:pointer;transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop img{max-height:120px;max-width:min(180px,100%);border-radius:6px;border:1px solid var(--line)}
.imp-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.reading{display:inline-flex;gap:4px;align-items:center}
.reading i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.1s infinite}
.reading i:nth-child(2){animation-delay:.18s}.reading i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.prev{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;max-height:360px;overflow:auto}
.prev-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer}
.prev-row:first-child{border-top:none}
.prev-row .name{display:block;font-weight:600;overflow-wrap:anywhere}
.prev-row .when{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.modes{display:flex;flex-wrap:wrap;gap:14px;font-size:13px}
.modes label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
/* shell + sidebar */
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);align-items:start}
.main{min-width:0}
.side{position:sticky;top:env(safe-area-inset-top, 0px);height:calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));background:var(--side);color:var(--on-navy);display:flex;flex-direction:column;gap:26px;padding-block:22px 18px;padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:14px;overflow-x:hidden;overflow-y:auto;isolation:isolate}
.side::before{content:"";position:absolute;left:-60%;right:-60%;bottom:-30%;height:60%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side, var(--glow1), transparent);animation:breathe 9s ease-in-out infinite alternate}
@keyframes breathe{from{transform:translateY(10%) scale(.9);opacity:.35}to{transform:translateY(-5%) scale(1.1);opacity:.75}}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px;color:var(--on-navy);text-decoration:none}
.brand b{font-family:var(--f-display);font-size:17px;letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:9px;background:var(--on-navy);position:relative;flex:none}
.mark i{position:absolute;inset:7px;border-radius:50%;border:2px solid var(--side);animation:spin 7s linear infinite}
.mark i::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--fyp);top:-4px;left:50%;margin-left:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
.nav-label{padding:0 12px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-navy-muted);margin-bottom:-18px}
.nav{display:flex;flex-direction:column;gap:2px;position:relative}
.nav a{position:relative;z-index:1;display:flex;gap:11px;align-items:center;padding:9px 12px;border-radius:9px;color:var(--on-navy-muted);text-decoration:none;font-weight:500;transition:color .25s}
.nav a svg{flex:none;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.nav a:hover{color:var(--on-navy)}
.nav a:hover svg{transform:scale(1.15)}
.nav a[aria-current="page"]{color:var(--on-navy)}
.nav .k{margin-left:auto;font-size:11px;color:var(--on-navy-muted)}
.nav .ind{position:absolute;left:0;top:0;width:0;height:0;border-radius:9px;background:var(--navy-soft);box-shadow:inset 3px 0 0 var(--on-navy);transition:transform .45s cubic-bezier(.3,.7,.2,1),width .45s cubic-bezier(.3,.7,.2,1),height .45s cubic-bezier(.3,.7,.2,1)}
.side-foot{margin-top:auto;padding:14px;border-radius:12px;background:var(--navy-soft);display:flex;flex-direction:column;gap:5px}
.side-foot .eyebrow{color:var(--on-navy-muted)}
.clock{font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1}
.clock .colon{animation:blink 2s steps(1) infinite}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-x{border:none;background:transparent;color:var(--on-navy-muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.side-x:hover{background:var(--navy-soft);color:var(--on-navy)}
.quick-add{display:flex;flex-direction:column;gap:6px}
.quick-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.quick-add .btn{width:100%;justify-content:center;background:transparent;color:var(--on-navy);border-color:var(--navy-line)}
.quick-add .btn:hover{border-color:var(--on-navy)}
.quick-add .btn.primary{background:var(--on-navy);color:var(--navy);border-color:var(--on-navy)}
.topbar{display:none;position:sticky;top:env(safe-area-inset-top, 0px);z-index:14;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));background:var(--side);color:var(--on-navy)}
.topbar b{font-family:var(--f-display);font-size:16px}
.topbar .btn{margin-left:auto;background:var(--on-navy);color:var(--navy);border-color:var(--on-navy)}
.menu-btn{border:1px solid var(--navy-line);background:transparent;color:var(--on-navy);width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none}
.menu-btn:hover{border-color:var(--on-navy)}
.shell[data-side="closed"]{grid-template-columns:minmax(0,1fr)}
.shell[data-side="closed"] .side{display:none}
.shell[data-side="closed"] .topbar{display:flex}
.scrim{display:none}
@media (max-width:900px){
  .shell{display:block}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:16;background:var(--side)}
  .topbar{display:flex}
  .side,.shell[data-side="closed"] .side{display:flex;position:fixed;top:0;left:0;bottom:0;height:auto;width:min(280px,84vw);z-index:30;transform:translateX(-105%);transition:transform .35s cubic-bezier(.3,.7,.2,1);padding-top:calc(22px + env(safe-area-inset-top, 0px));padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px))}
  .shell[data-side="open"] .side{transform:none}
  .shell[data-side="open"] .scrim{display:block;position:fixed;inset:0;z-index:29;background:var(--scrim-bg)}
}

/* ambient motion on navy bands */
.band{position:relative;overflow:hidden;isolation:isolate}
.band::before{content:"";position:absolute;inset:-50%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 30% 40%, var(--glowA, var(--glow1)), transparent 32%),radial-gradient(circle at 68% 62%, var(--glow2), transparent 30%);animation:drift 24s ease-in-out infinite alternate}
.band::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(var(--grid-dot) 1px, transparent 1.4px);background-size:22px 22px;-webkit-mask-image:linear-gradient(100deg,transparent 30%,#000 85%);mask-image:linear-gradient(100deg,transparent 30%,#000 85%);animation:pan 60s linear infinite}
@keyframes drift{0%{transform:translate(-4%,2%) rotate(0deg)}100%{transform:translate(6%,-4%) rotate(10deg)}}
@keyframes pan{to{background-position:440px 0}}
.a-fyp.band{--glowA:color-mix(in srgb, var(--fyp) 60%, transparent)}
.a-idp.band{--glowA:color-mix(in srgb, var(--idp) 60%, transparent)}

/* project page header */
.phero{background:var(--navy);color:var(--on-navy);border-radius:14px;padding:24px;display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-end}
.phero h1{font-size:30px;color:var(--on-navy)}
.phero .eyebrow{color:var(--on-navy-muted)}
.phero .meta{margin:0;color:var(--on-navy-muted);font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phero .meta b{color:var(--on-navy)}
.phero .beacon{--a:var(--on-navy)}
.phero-r{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.countdown{text-align:right}
.cd-n{display:block;font-family:var(--f-display);font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.countdown small{color:var(--on-navy-muted);font-size:12px}
.phero .btn{background:transparent;color:var(--on-navy);border-color:var(--navy-line)}
.phero .btn:hover{border-color:var(--on-navy)}

/* KPI rings */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:14px;align-items:center;min-width:0}
.ringw{position:relative;width:76px;height:76px;flex:none}
.ring{width:100%;height:100%;display:block}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--sunk)}
.ring .v{stroke:var(--a);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50px 50px;transition:stroke-dashoffset .9s cubic-bezier(.2,.7,.2,1)}
.ring-n{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:500}
.kv{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.ks{font-size:12px;color:var(--muted)}
@keyframes ringin{from{stroke-dashoffset:100}}
.view.enter .ring .v{animation:ringin 1.3s cubic-bezier(.2,.7,.2,1) both}
.view.enter .kpi{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.08s + var(--i,0)*.07s)}
.pgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}

/* charts */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.chart .lbl{fill:var(--ink);font-size:11px}
.chart .lbl.strong{font-weight:600;fill:var(--a);font-size:12px}
.chart .ln{fill:none;stroke:var(--a);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.chart .area{fill:var(--a);opacity:.12}
.chart .pace{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5}
.chart .goal{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.chart .pt{fill:var(--surface);stroke:var(--a);stroke-width:2}
.chart .end{fill:var(--a);stroke:var(--surface);stroke-width:2}
.chart .pulse{fill:var(--a);transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.chart .today{stroke:var(--danger);stroke-width:1;stroke-dasharray:2 3}
.chart .lbl-today{fill:var(--danger)}
.chart .bar-b{transform-box:fill-box;transform-origin:center bottom}
.chart .wk-now{fill:var(--ink);font-weight:600}
.ch-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.ch-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}
@keyframes risey{from{transform:scaleY(0)}}
@keyframes pulse{0%{transform:scale(1);opacity:.45}100%{transform:scale(3.2);opacity:0}}
.view.enter .chart .ln{animation:draw 1.5s .25s cubic-bezier(.45,.05,.2,1) both}
.view.enter .chart .area{animation:fadein 1s 1s both}
.view.enter .chart .pt,.view.enter .chart .end,.view.enter .chart .pace,.view.enter .chart .goal,.view.enter .chart .lbl{animation:fadein .6s 1.2s both}
.view.enter .chart .bar-b{animation:risey .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.2s + var(--i,0)*.06s)}

/* milestone timeline */
.tl{display:flex;flex-direction:column}
.tl-item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;position:relative;padding-bottom:16px}
.tl-item::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line);transform-origin:top}
.tl-item:last-child{padding-bottom:0}
.tl-item:last-child::before{display:none}
.tl-item.done::before{background:var(--a)}
.tl-dot{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--a);background:var(--surface);margin:2px 3px;position:relative}
.tl-item.done .tl-dot{background:var(--a)}
.tl-item.todo .tl-dot{border-color:var(--line)}
.tl-item.doing .tl-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--a);animation:ping 1.8s ease-out infinite}
.tl-item .title{font-weight:600;overflow-wrap:anywhere}
.tl-item.done .title{color:var(--muted)}
@keyframes growy{from{transform:scaleY(0)}}
.view.enter .tl-item{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.2s + var(--i,0)*.07s)}
.view.enter .tl-item.done::before{animation:growy .6s both;animation-delay:calc(.35s + var(--i,0)*.07s)}

/* references */
.stack{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--sunk);gap:2px}
.stack i{display:block;height:100%;transform-origin:left center}
.view.enter .stack i{animation:grow .8s .2s cubic-bezier(.2,.7,.2,1) both}
.refs-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:12px}
.ref{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:7px;background:var(--surface);transition:transform .25s cubic-bezier(.2,.7,.2,1),border-color .25s,box-shadow .25s;min-width:0}
.ref:hover{transform:translateY(-3px);border-color:var(--a);box-shadow:0 10px 22px -16px var(--a)}
.ref-top{display:flex;gap:6px;align-items:center}
.ref-top .icon-btn{margin-left:auto}
.ref h4{margin:0;font-family:var(--f-display);font-size:15px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.ref .by{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.ref .sum{margin:0;font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ref.open .sum{display:block;-webkit-line-clamp:unset}
.ref .foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.ref .foot a{font-size:12.5px;font-weight:600;color:var(--a);text-decoration:none}
.ref .foot a:hover{text-decoration:underline}
.pill-btn{border:none;cursor:pointer}
.view.enter .ref{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.25s + var(--i,0)*.05s)}

/* team */
.team{display:flex;flex-direction:column;gap:10px}
.member{display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;color:var(--a);background:var(--sunk);border:2px solid var(--a);flex:none}
.view.enter .member{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.3s + var(--i,0)*.06s)}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.pgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){
  .kpis{grid-template-columns:minmax(0,1fr)}
  .ringw{width:64px;height:64px}
  .phero{padding:18px}
  .phero h1{font-size:24px}
  .cd-n{font-size:36px}
  .phero-r,.countdown{align-items:flex-start;text-align:left}
}
.kpis.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:700px){.kpis.n3{grid-template-columns:minmax(0,1fr)}}

/* floating article browser */
.ref-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ref-bar select.field{width:auto}
.segt{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.segt button{border:none;background:transparent;padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--muted)}
.segt button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.upl-list{display:flex;flex-direction:column;gap:6px}
.upl-list:empty{display:none}
.upl{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:7px 10px;border-radius:8px;background:var(--sunk);overflow-wrap:anywhere}
.upl.err{background:var(--danger-soft);color:var(--danger)}
.upl.ok{background:var(--ok-soft);color:var(--ok)}
.flow-wrap{display:flex;flex-direction:column;gap:10px}
.flow{position:relative;height:350px;perspective:1100px;outline:none;border-radius:12px}
.flow::before{content:"";position:absolute;left:15%;right:15%;top:8%;bottom:8%;border-radius:50%;background:radial-gradient(closest-side, color-mix(in srgb, var(--a) 22%, transparent), transparent);animation:breathe 7s ease-in-out infinite alternate;pointer-events:none}
.flow:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.flow-stage{position:absolute;inset:0;transform-style:preserve-3d;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.flow-stage.drag{cursor:grabbing}
.fcard{position:absolute;left:50%;top:50%;width:200px;height:278px;padding:0;border:none;background:none;transition:transform .65s cubic-bezier(.2,.75,.2,1),opacity .5s;transform-style:preserve-3d;will-change:transform;color:inherit}
.fcard-in{display:block;position:relative;width:100%;height:100%;border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 40px -22px var(--cap-bg);animation:float 6s ease-in-out infinite;animation-delay:var(--d,0s)}
.fcard.on .fcard-in{box-shadow:0 28px 50px -22px color-mix(in srgb, var(--c) 70%, transparent),0 0 0 2px var(--c)}
@keyframes float{0%,100%{transform:translateY(-6px)}50%{transform:translateY(7px)}}
.fcard img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;pointer-events:none}
.fcover{position:absolute;inset:0;background:linear-gradient(155deg,var(--c),var(--navy) 85%);display:flex;padding:18px 16px;color:var(--on-navy);font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.2;text-align:left;overflow:hidden}
.fcover span{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.fcap{position:absolute;left:0;right:0;bottom:0;padding:30px 12px 11px;background:linear-gradient(transparent,var(--cap-bg) 45%);color:var(--on-navy);text-align:left;display:flex;flex-direction:column;gap:3px}
.fcap b{font-size:12.5px;line-height:1.3;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.fcap small{font-size:11px;color:var(--on-navy-muted)}
.fstat{position:absolute;top:10px;right:10px}
.flow-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:300;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;font-size:22px;line-height:1;transition:transform .2s,border-color .2s}
.flow-nav:hover{border-color:var(--ink);transform:translateY(-50%) scale(1.08)}
.flow-nav:disabled{opacity:.3;cursor:default;transform:translateY(-50%)}
.flow-nav.prev{left:4px}.flow-nav.next{right:4px}
.flow-meta{display:flex;justify-content:center;gap:6px;align-items:center;flex-wrap:wrap}
.fdot{width:8px;height:8px;border-radius:999px;border:none;padding:0;background:var(--line);transition:width .3s,background .3s}
.fdot.on{width:22px;background:var(--a)}
.flow-detail{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.flow-detail.swap{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.fd-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fd-title{font-size:18px;line-height:1.3;overflow-wrap:anywhere}
.fd-sum{margin:0;font-size:14px;line-height:1.6;max-width:75ch;overflow-wrap:anywhere}
.flow-detail .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flow-detail .foot a{text-decoration:none}
.flow-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:36px 16px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted)}
.ghosts{display:flex;gap:10px;margin-bottom:6px}
.ghosts i{width:46px;height:62px;border-radius:7px;background:var(--sunk);border:1px solid var(--line);animation:float 5s ease-in-out infinite}
.ghosts i:nth-child(2){animation-delay:-1.6s;transform:translateY(-6px)}
.ghosts i:nth-child(3){animation-delay:-3.2s}
@media (max-width:640px){.flow{height:290px}.fcard{width:160px;height:222px}.fcover{font-size:15px}.flow-nav{width:34px;height:34px}}

/* logbook */
.lb-panel{display:flex;flex-direction:column;gap:10px}
.lb-panel .drop{cursor:pointer}
.wk-list{display:flex;flex-direction:column;gap:10px}
.wk{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.wk-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.wk-n{min-width:40px;height:40px;padding:0 6px;border-radius:10px;background:var(--accent-soft);color:var(--ink);display:grid;place-items:center;font-weight:600;font-size:13px}
.wk-h b{overflow-wrap:anywhere}
.wk-sum{margin:0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;overflow-wrap:anywhere;max-width:100%}
.view.enter .wk{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.3s + var(--i,0)*.06s)}
.share{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px;background:var(--sunk)}
.share i{display:block;height:100%;transform-origin:left center}
.view.enter .share i{animation:grow .9s .4s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(function(){
const AREAS={work:"Work",fyp:"FYP",idp:"IDP",src:"SRC",personal:"Personal"};
const COLLS=["tasks","events","milestones","routines","projects","classes","refs","logbook"];
const S={tasks:{},events:{},milestones:{},routines:{},projects:{},classes:{},refs:{},logbook:{}};
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
let db=null, mode="loading", readOnly=false, loaded=false;
const PWA=!!window.FYD_PWA;
const idb={
  open(){if(!this.p)this.p=new Promise((res,rej)=>{const r=indexedDB.open("fyd-store",1);r.onupgradeneeded=()=>{r.result.createObjectStore("pdf");r.result.createObjectStore("kv");};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}).catch(e=>{this.p=null;throw e;});return this.p;},
  async run(store,mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const q=fn(t.objectStore(store));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  put(s,k,v){return this.run(s,"readwrite",st=>st.put(v,k));},
  get(s,k){return this.run(s,"readonly",st=>st.get(k));},
  del(s,k){return this.run(s,"readwrite",st=>st.delete(k));}
};

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1);};
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||"");
const TODAY=ymd(new Date());
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtShort=s=>{const d=parse(s);return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const areaOf=a=>AREAS[a]?a:"personal";

const ui={filter:"all",showDone:false,calMonth:TODAY.slice(0,7)+"-01",selDay:TODAY};
try{const f=localStorage.getItem("fyd.filter");if(f&&(f==="all"||AREAS[f]))ui.filter=f;}catch(e){}

function dueLabel(due){
  if(!isDate(due))return {text:"No date",cls:""};
  const n=daysBetween(TODAY,due);
  if(n<0)return {text:"Overdue "+(-n)+"d",cls:"bad"};
  if(n===0)return {text:"Today",cls:"today"};
  if(n===1)return {text:"Tomorrow",cls:""};
  return {text:fmtShort(due),cls:""};
}
const dMinus=n=>n<0?"D+"+(-n):n===0?"D-day":"D-"+n;

/* ---------- storage ---------- */
const queues={};
function enqueue(key,fn){const p=(queues[key]||Promise.resolve()).catch(()=>{}).then(fn);queues[key]=p;return p;}
function onWriteError(e){
  if(e&&e.code==="invalid_argument"){readOnly=true;toast("You can view this desk but not change it.");}
  else if(e&&e.code==="quota_exceeded"){toast("Storage is full. Delete some old items and try again.");}
  else toast("Could not save. Check your connection and try again.");
}
function save(c,id,data){
  S[c]=Object.assign({},S[c],{[id]:data});render();
  if(mode==="db"){return enqueue(c+"/"+id,()=>db.collection(c).doc(id).set(data)).catch(onWriteError);}
  saveLocal();return Promise.resolve();
}
function remove(c,id){
  const m=Object.assign({},S[c]);delete m[id];S[c]=m;render();
  if(mode==="db"){return enqueue(c+"/"+id,()=>db.collection(c).doc(id).delete()).catch(onWriteError);}
  saveLocal();return Promise.resolve();
}
function applyState(o){if(o&&typeof o==="object")COLLS.forEach(c=>{if(o[c]&&typeof o[c]==="object")S[c]=o[c];});}
let saveT=null;
function saveLocal(){
  if(PWA){clearTimeout(saveT);saveT=setTimeout(()=>{idb.put("kv","state",S).catch(()=>{try{localStorage.setItem("fyd.local",JSON.stringify(S));}catch(e){toast("Couldn't save on this device. Storage may be full.");}});},150);return;}
  try{localStorage.setItem("fyd.local",JSON.stringify(S));}catch(e){}
}
async function loadLocal(){
  if(PWA){try{const o=await idb.get("kv","state");if(o){applyState(o);return;}}catch(e){}}
  try{const raw=localStorage.getItem("fyd.local");if(raw)applyState(JSON.parse(raw));}catch(e){}
}
async function exportData(){
  const data=JSON.stringify({app:"fadhs-desk",version:1,exportedAt:new Date().toISOString(),data:S});
  const name="fadhs-desk-backup-"+TODAY+".json";
  if(!PWA){
    let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;}catch(e){dl=null;}
    if(!dl){toast("Saving files isn't available in this view.");return;}
    try{await dl.save({filename:name,data});toast("Backup saved");}catch(e){if(!e||e.code!=="declined")toast("Couldn't save the backup. Try again.");}
    return;
  }
  const u=URL.createObjectURL(new Blob([data],{type:"application/json"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast("Backup downloaded");
}
let pendingImport=null;
function setupImport(){
  const btn=document.getElementById("importBtn"),inp=document.getElementById("importIn");if(!btn||!inp)return;
  btn.hidden=!PWA;
  inp.addEventListener("change",async()=>{
    const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
    try{
      const o=JSON.parse(await f.text()),d=o&&o.data&&typeof o.data==="object"?o.data:o;let n=0;
      COLLS.forEach(c=>{if(d&&d[c]&&typeof d[c]==="object")n+=Object.keys(d[c]).length;});
      if(!n)throw new Error("empty");
      pendingImport=d;
      setNote("import",'<span>This backup has '+n+' items'+(o.exportedAt?' from '+esc(String(o.exportedAt).slice(0,10)):"")+'. Importing replaces everything saved on this device.</span><span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small primary" data-act="import-confirm" type="button">Replace my data</button><button class="btn small" data-act="import-cancel" type="button">Cancel</button></span>',"info");
    }catch(e){toast("That file isn't a Fadh's Desk backup.");}
  });
}

const notes={};
function setNote(key,html,cls){if(html)notes[key]={html,cls:cls||""};else delete notes[key];renderNotes();}
function renderNotes(){
  const el=document.getElementById("notes");
  const ex=Object.values(S).some(m=>Object.values(m).some(d=>d&&d.example));
  let h=Object.values(notes).map(n=>'<div class="note '+n.cls+'">'+n.html+'</div>').join("");
  if(ex&&!readOnly)h+='<div class="note info"><span>Some entries are examples to show how the desk works. Edit them into your own, or clear them all.</span><button class="btn small" data-act="clear-examples" type="button">Remove examples</button></div>';
  el.innerHTML=h;el.style.display=h?"flex":"none";el.style.flexDirection="column";el.style.gap="8px";
}

async function init(){
  render();
  let ns=null;
  try{ns=window.claude&&window.claude.use?await window.claude.use("db"):null;}catch(e){ns=null;}
  if(!ns){
    mode="local";await loadLocal();loaded=true;
    if(PWA){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}}
    else setNote("mode","<span>Saving in this browser only. Open the published page to keep your desk across devices.</span>");
    render();setTimeout(replayEnter,0);return;
  }
  db=ns;mode="db";
  const pending=new Set(COLLS);
  setNote("load","<span>Loading your desk…</span>","info");
  const timer=setTimeout(()=>{if(pending.size)setNote("load","<span>Your saved data can't be reached yet. What you see may be out of date.</span>");},10000);
  COLLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      const m={};snap.docs.forEach(d=>{m[d.id]=d.data();});S[c]=m;
      if(!snap.metadata.fromCache&&pending.has(c)){pending.delete(c);if(!pending.size){clearTimeout(timer);loaded=true;setNote("load",null);setTimeout(replayEnter,0);}}
      render();
    },err=>{
      pending.delete(c);if(!pending.size){clearTimeout(timer);loaded=true;}
      setNote("load","<span>Some data could not load ("+esc(c)+"). Reload the page to try again.</span>");render();
    });
  });
}

/* ---------- derived ---------- */
const tasks=()=>Object.entries(S.tasks).map(([id,d])=>Object.assign({id},d));
const events=()=>Object.entries(S.events).map(([id,d])=>Object.assign({id},d));
const milestones=p=>Object.entries(S.milestones).map(([id,d])=>Object.assign({id},d)).filter(m=>!p||m.project===p).sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
const routines=()=>Object.entries(S.routines).map(([id,d])=>Object.assign({id},d)).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
const project=k=>Object.assign({title:k==="fyp"?"Final Year Project":"Integrated Design Project"},S.projects[k]||{});
const settings=()=>S.projects.settings||{};
const classes=()=>Object.entries(S.classes).map(([id,d])=>Object.assign({id},d));
const clsColor=c=>{const n=Number(c.color);return n>=1&&n<=7?n:4;};

function progress(k){
  const ms=milestones(k);const done=ms.filter(m=>m.status==="done").length;
  return {done,total:ms.length,pct:ms.length?Math.round(done/ms.length*100):0};
}
function dayItems(d){
  const out=[];const wd=parse(d).getDay();
  events().forEach(e=>{if(e.date===d)out.push({kind:"Event",coll:"events",id:e.id,title:e.title,area:areaOf(e.area),time:e.start||"",end:e.end||"",extra:e.location||""});});
  routines().forEach(r=>{if(Array.isArray(r.days)&&r.days.includes(wd))out.push({kind:"Routine",coll:"routines",id:r.id,title:r.title,area:areaOf(r.area),time:r.time||""});});
  classes().forEach(c=>{if(Number(c.day)===wd)out.push({kind:"Class",coll:"classes",id:c.id,title:c.title,area:"personal",label:c.type||"Class",color:clsColor(c),time:c.start||"",end:c.end||"",extra:c.room||""});});
  tasks().forEach(t=>{if(t.due===d)out.push({kind:"Task due",coll:"tasks",id:t.id,title:t.title,area:areaOf(t.area),time:"",done:!!t.done});});
  milestones().forEach(m=>{if(m.due===d)out.push({kind:"Milestone",coll:"milestones",id:m.id,title:m.title,area:m.project==="idp"?"idp":"fyp",time:"",done:m.status==="done"});});
  ["fyp","idp"].forEach(k=>{const p=S.projects[k];if(p&&p.deadline===d)out.push({kind:"Final deadline",coll:"projects",id:k,title:project(k).title,area:k,time:""});});
  return out.sort((a,b)=>(a.time||"").localeCompare(b.time||""));
}
function nextDeadline(){
  const c=[];
  tasks().forEach(t=>{if(!t.done&&isDate(t.due)&&t.due>=TODAY)c.push({title:t.title,due:t.due,area:areaOf(t.area)});});
  milestones().forEach(m=>{if(m.status!=="done"&&isDate(m.due)&&m.due>=TODAY)c.push({title:m.title,due:m.due,area:m.project==="idp"?"idp":"fyp"});});
  ["fyp","idp"].forEach(k=>{const p=S.projects[k];if(p&&isDate(p.deadline)&&p.deadline>=TODAY)c.push({title:project(k).title+" submission",due:p.deadline,area:k});});
  c.sort((a,b)=>a.due.localeCompare(b.due));return c;
}

let greetShift=0;
function renderGreeting(){
  const n=(String(settings().name||"").trim())||"Fadh";
  const now=new Date(),h=now.getHours();
  const opts=h<5?["Still up, "+n+"?","Late one, "+n+"?"]:h<12?["Good morning, "+n+"!","Morning, "+n+"!","Hi "+n+"!"]:h<17?["Good afternoon, "+n+"!","Hi "+n+"!","Hey "+n+"!"]:h<22?["Good evening, "+n+"!","Hi "+n+"!","Evening, "+n+"!"]:["Winding down, "+n+"?","Hi "+n+"!"];
  const seed=Math.floor(now.getTime()/36e5)+greetShift;
  document.getElementById("hello").textContent=opts[seed%opts.length];
  document.getElementById("heroQuote").textContent=QUOTES[seed%QUOTES.length];
  const open=tasks().filter(t=>!t.done);
  const over=open.filter(t=>isDate(t.due)&&t.due<TODAY),today=open.filter(t=>t.due===TODAY);
  const pr={high:0,med:1,low:2};
  const first=over.concat(today).sort((a,b)=>(pr[a.priority]??1)-(pr[b.priority]??1))[0];
  const nowT=pad(h)+":"+pad(now.getMinutes());
  const next=dayItems(TODAY).find(i=>i.time&&i.time>=nowT&&(i.coll==="events"||i.coll==="routines"||i.coll==="classes"));
  let msg;
  if(!loaded)msg="Getting your day ready…";
  else if(today.length||over.length){
    const parts=[];if(today.length)parts.push(today.length+" task"+(today.length>1?"s":"")+" due today");if(over.length)parts.push(over.length+" overdue");
    msg="You have "+parts.join(" and ")+"."+(first?" Start with “"+first.title+"”.":"");
  } else msg="Nothing due today. A good day to get ahead.";
  if(loaded&&next)msg+=" Next up: "+next.title+" at "+next.time+".";
  document.getElementById("heroMsg").textContent=msg;
}

  const pr={high:0,med:1,low:2};
  const sort=a=>a.sort((x,y)=>(x.due||"9999").localeCompare(y.due||"9999")||(pr[x.priority]??1)-(pr[y.priority]??1));
  const open=list.filter(t=>!t.done);const week=addDays(TODAY,7);
  const groups=[
    ["Overdue","bad",open.filter(t=>isDate(t.due)&&t.due<TODAY)],

    ["Next 7 days","",open.filter(t=>isDate(t.due)&&t.due>TODAY&&t.due<=week)],
    ["Later","",open.filter(t=>isDate(t.due)&&t.due>week)],

  if(ui.showDone)groups.push(["Done","",list.filter(t=>t.done)]);

const CAL_SVG='<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2" fill="none"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3M8 8.5v4M6 10.5h4"/></svg>';
const BYDAY=["SU","MO","TU","WE","TH","FR","SA"];
function calTitle(i){return i.kind==="Task due"?"Due: "+i.title:i.kind==="Final deadline"?i.title+" submission":i.title;}
function endTime(i,d){
  if(i.end&&i.end>i.time)return {date:d,time:i.end};
  const [h,m]=i.time.split(":").map(Number);
  return h+1>=24?{date:addDays(d,1),time:pad(h+1-24)+":"+pad(m)}:{date:d,time:pad(h+1)+":"+pad(m)};
}
function googleUrl(i,d){
  const D=s=>s.replace(/-/g,"");let dates;
  if(i.time){const e=endTime(i,d);dates=D(d)+"T"+i.time.replace(":","")+"00/"+D(e.date)+"T"+e.time.replace(":","")+"00";}
  else dates=D(d)+"/"+D(addDays(d,1));
  const p=new URLSearchParams({action:"TEMPLATE",text:calTitle(i),dates,details:(i.label||AREAS[i.area])+" · from Fadh's Desk"});
  if(i.extra)p.set("location",i.extra);
  if(i.coll==="routines"){const r=S.routines[i.id];if(r&&Array.isArray(r.days)&&r.days.length)p.set("recur","RRULE:FREQ=WEEKLY;BYDAY="+r.days.map(n=>BYDAY[n]).join(","));}
  if(i.coll==="classes"){const c=S.classes[i.id];if(c&&BYDAY[Number(c.day)])p.set("recur","RRULE:FREQ=WEEKLY;BYDAY="+BYDAY[Number(c.day)]);}
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
function outlookUrl(i,d){
  const p=new URLSearchParams({path:"/calendar/action/compose",rru:"addevent",subject:calTitle(i),body:(i.label||AREAS[i.area])+" · from Fadh's Desk"});
  if(i.time){const e=endTime(i,d);p.set("startdt",d+"T"+i.time+":00");p.set("enddt",e.date+"T"+e.time+":00");}
  else{p.set("startdt",d);p.set("enddt",addDays(d,1));p.set("allday","true");}
  if(i.extra)p.set("location",i.extra);
  return "https://outlook.live.com/calendar/0/deeplink/compose?"+p.toString();
}

/* ---------- timetable ---------- */
const DAYNAMES=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const toMin=t=>{const p=String(t||"").split(":").map(Number);return (p[0]||0)*60+(p[1]||0);};
const fmtIn=m=>m<60?m+" min":m<1440?Math.floor(m/60)+"h"+(m%60?" "+(m%60)+"m":""):Math.floor(m/1440)+"d "+Math.floor(m%1440/60)+"h";
const fmtHrs=m=>(m/60).toFixed(m%60?1:0)+"h";
function renderTimetable(){
  const all=classes().map(c=>{const s=toMin(c.start);let e=toMin(c.end);if(e<=s)e=s+60;return Object.assign({},c,{day:Number(c.day),s,e,col:clsColor(c)});});
  const now=new Date(),wd=now.getDay(),nowM=now.getHours()*60+now.getMinutes();
  const byDay=d=>all.filter(c=>c.day===d).sort((a,b)=>a.s-b.s||a.e-b.e);
  let curC=null,next=null,nextIn=0,nextDay=0;
  byDay(wd).forEach(c=>{if(!curC&&c.s<=nowM&&nowM<c.e)curC=c;});
  for(let o=0;o<=7&&!next;o++){const d=(wd+o)%7;const c=byDay(d).find(c=>o>0||c.s>nowM);if(c){next=c;nextIn=o*1440+c.s-nowM;nextDay=d;}}
  const nowEl=document.getElementById("ttNow");
  const meta=c=>esc(c.type||"Class")+(c.room?" · "+esc(c.room):"")+" · "+esc(c.start)+"–"+esc(c.end);
  if(curC){
    const pc=Math.round((nowM-curC.s)/(curC.e-curC.s)*100);
    nowEl.style.setProperty("--a","var(--c"+curC.col+")");
    nowEl.innerHTML='<span class="beacon"></span><div style="min-width:0"><div class="eyebrow">Happening now</div><h2>'+esc(curC.title)+'</h2><div class="muted" style="font-size:12.5px">'+meta(curC)+(next?' · then '+esc(next.title)+(nextDay===wd&&nextIn<1440?' at '+esc(next.start):' on '+DAYNAMES[nextDay]):'')+'</div></div>'+
      '<div class="count">'+fmtIn(curC.e-nowM)+'<small>left</small></div><div class="bar"><i style="width:'+pc+'%"></i></div>';
  } else if(next){
    const when=nextDay===wd&&nextIn<1440?"today":nextDay===(wd+1)%7&&nextIn<2880?"tomorrow":DAYNAMES[nextDay];
    nowEl.style.setProperty("--a","var(--c"+next.col+")");
    nowEl.innerHTML='<span class="beacon still"></span><div style="min-width:0"><div class="eyebrow">Next class · '+when+'</div><h2>'+esc(next.title)+'</h2><div class="muted" style="font-size:12.5px">'+meta(next)+'</div></div>'+
      '<div class="count">'+fmtIn(nextIn)+'<small>until it starts</small></div>';
  } else nowEl.innerHTML='<div class="empty" style="grid-column:1 / -1;padding:0">'+(loaded?"No classes yet. Use Import from image to read your timetable, or add classes one by one with + Class.":"Loading your timetable…")+'</div>';
  const days=[1,2,3,4,5].concat([6,0].filter(d=>all.some(c=>c.day===d)));
  let lo=480,hi=1080;all.forEach(c=>{lo=Math.min(lo,Math.floor(c.s/60)*60);hi=Math.max(hi,Math.ceil(c.e/60)*60);});
  const span=hi-lo;
  document.getElementById("ttMeta").textContent=all.length?all.length+" classes · "+fmtHrs(all.reduce((n,c)=>n+c.e-c.s,0))+" a week":"";
  document.getElementById("tt").innerHTML=days.map((d,idx)=>{
    const list=byDay(d);const mins=list.reduce((n,c)=>n+c.e-c.s,0);

function renderWorkload(){
  const el=document.getElementById("idpChart"),sub=document.getElementById("idpChartSub");if(!el)return;
  const mon=addDays(TODAY,-((parse(TODAY).getDay()+6)%7));
  const weeks=[];for(let i=0;i<8;i++){const s=addDays(mon,i*7);weeks.push({s,e:addDays(s,6),t:0,m:0,ev:0});}
  const put=(d,key)=>{const w=weeks.find(w=>d>=w.s&&d<=w.e);if(w)w[key]++;};
  tasks().forEach(t=>{if(!t.done&&areaOf(t.area)==="idp"&&isDate(t.due))put(t.due,"t");});
  milestones("idp").forEach(m=>{if(m.status!=="done"&&isDate(m.due))put(m.due,"m");});
  events().forEach(e=>{if(areaOf(e.area)==="idp"&&isDate(e.date))put(e.date,"ev");});
  const tot=weeks.map(w=>w.t+w.m+w.ev),sum=tot.reduce((a,b)=>a+b,0),peak=Math.max(...tot);
  sub.textContent=sum?sum+" IDP items in the next 8 weeks · busiest is the week of "+shortDate(weeks[tot.indexOf(peak)].s):"Nothing is scheduled for IDP in the next 8 weeks.";
  const top=Math.max(3,peak),W=640,H=220,L=28,R=8,T=18,B=30,bw=(W-L-R)/8,Y=v=>T+(1-v/top)*(H-T-B);
  let g="";const step=Math.max(1,Math.ceil(top/4));for(let v=0;v<=top;v+=step){const y=Y(v).toFixed(1);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"></line><text x="'+(L-6)+'" y="'+(Number(y)+3)+'" text-anchor="end">'+v+'</text>';}
  const SEGS=[["t","var(--a)"],["m","var(--c5)"],["ev","var(--c6)"]];
  let bars="";
  weeks.forEach((w,i)=>{
    const x=L+i*bw+bw*.2,wd=bw*.6;let y=Y(0);
    SEGS.forEach(([key,col])=>{if(!w[key])return;const h=Y(0)-Y(w[key]);y-=h;bars+='<rect class="bar-b" style="--i:'+i+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+wd.toFixed(1)+'" height="'+Math.max(1,h-1.5).toFixed(1)+'" rx="3" fill="'+col+'"></rect>';});
    if(tot[i])bars+='<text class="lbl" x="'+(x+wd/2).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle">'+tot[i]+'</text>';

function renderYears(){
  const el=document.getElementById("fypSide");if(!el)return;
  const ys=refsOf("fyp").map(r=>Number(r.year)).filter(y=>y>1900&&y<3000);
  if(!ys.length){el.innerHTML='<div class="empty">Add the publication year to your references to see how recent your sources are.</div>';return;}
  const maxY=Math.max(...ys);let minY=Math.min(...ys);const older=minY<maxY-11;if(older)minY=maxY-11;
  const bins=[];for(let y=minY;y<=maxY;y++)bins.push({y,n:0});
  ys.forEach(y=>{bins[Math.max(0,y-minY)].n++;});
  const top=Math.max(...bins.map(b=>b.n)),W=320,H=150,L=6,R=6,T=16,B=22,bw=(W-L-R)/Math.max(bins.length,4),Y=v=>T+(1-v/top)*(H-T-B);
  const bars=bins.map((b,i)=>{const x=L+i*bw+bw*.15,cx=(x+bw*.35).toFixed(1);const lab=(older&&i===0?"≤":"")+"'"+String(b.y).slice(2);
    return (b.n?'<rect class="bar-b" style="--i:'+i+'" x="'+x.toFixed(1)+'" y="'+Y(b.n).toFixed(1)+'" width="'+(bw*.7).toFixed(1)+'" height="'+(Y(0)-Y(b.n)).toFixed(1)+'" rx="2" fill="var(--a)"><title>'+(older&&i===0?"Up to ":"")+b.y+": "+b.n+'</title></rect><text class="lbl" x="'+cx+'" y="'+(Y(b.n)-4).toFixed(1)+'" text-anchor="middle">'+b.n+'</text>':"")+'<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle">'+lab+'</text>';}).join("");
  const sorted=ys.slice().sort((a,b)=>a-b),med=sorted[Math.floor(sorted.length/2)],yr=new Date().getFullYear(),recent=ys.filter(y=>y>=yr-5).length;
  el.innerHTML='<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Number of references by publication year"><g class="grid"><line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0)+'" y2="'+Y(0)+'"></line></g>'+bars+'</svg></div><div class="muted" style="font-size:12.5px">Median year '+med+' · '+recent+' of '+ys.length+' from the last 5 years</div>';
}

let pdfjsP=null,mammothP=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error("Couldn't load the file reader. Check your connection."));document.head.appendChild(s);});}

async function pdfRead(file,maxPages,withCover){

  let text="";const n=Math.min(doc.numPages,maxPages);
  for(let i=1;i<=n;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();text+=tc.items.map(t=>t.str||"").join(" ")+"\n";}

const REF_PROMPT='Below is the text from the first pages of an academic paper or technical document (PDF). Reply with only a JSON object like:\n'+
  '{"title":"","authors":"Surname A., Surname B.","year":2021,"source":"journal, conference, standard or publisher","doi":"","summary":"2 or 3 plain sentences for a literature review: what was studied, how, and the key finding"}\n'+
  'List at most 4 authors, then "et al.". Use "" or 0 when something is not in the text. Do not invent details.\n\nPDF text:\n';
async function ingestRefs(k,files){
  if(readOnly){toast("You can view this desk but not change it.");return;}

    const job={name:f.name||"PDF",step:"Opening PDF",err:"",done:false};ui.upl[k].push(job);renderUpl(k);
    try{
      if(!(f.type==="application/pdf"||/\.pdf$/i.test(f.name||"")))throw new Error("Only PDF files can be added here.");
      if(f.size>20*1024*1024)throw new Error("This PDF is over 20 MB.");

      let pdfId="",pdfUrl="",localPdf=false;const id="r-"+newId();
      if(assetsNs){job.step="Saving the PDF";renderUpl(k);try{const a=await assetsNs.upload(f);pdfId=a&&a.id||"";pdfUrl=a&&a.url||"";}catch(e){}}
      else if(PWA){job.step="Saving the PDF";renderUpl(k);try{await idb.put("pdf",id,f);localPdf=true;}catch(e){}}
      let info={};
      if(sampleFn&&text.trim()){job.step="Claude is reading it";renderUpl(k);try{const v=await sampleFn.json(REF_PROMPT+text.slice(0,14000),{modelTier:"quick"});if(v&&typeof v==="object"&&!Array.isArray(v))info=v;}catch(e){info={};}}
      const str=v=>typeof v==="string"?v.trim():"";
      const doi=str(info.doi).replace(/^https?:\/\/(dx\.)?doi\.org\//i,"");const y=parseInt(info.year,10);
      const ref={title:(str(info.title)||str(meta.Title)||String(f.name||"Untitled").replace(/\.pdf$/i,"")).slice(0,300),authors:(str(info.authors)||str(meta.Author)).slice(0,300),
        year:y>1900&&y<3000?y:0,source:str(info.source).slice(0,200),link:/^10\.\d{4,}\//.test(doi)?"https://doi.org/"+doi:"",summary:str(info.summary).slice(0,1500),
        abstract:text.replace(/\s+/g," ").trim().slice(0,3500),project:k,status:"to-read",chapter:"",cover:cover&&cover.length<180000?cover:"",pdfId,pdfUrl,localPdf,fileName:f.name||"",createdAt:new Date().toISOString()};
      await save("refs",id,ref);
      ui.refSel[k]=id;renderRefs(k);

    }catch(e){job.err=(e&&e.message)||"Couldn't read this PDF.";}
    renderUpl(k);

const LBCAT={research:["Reading and research","var(--c4)"],design:["Design and planning","var(--c5)"],lab:["Lab and experiments","var(--c1)"],analysis:["Analysis and simulation","var(--c2)"],writing:["Writing","var(--c3)"],meeting:["Supervisor meetings","var(--c6)"],admin:["Admin and other","var(--muted)"]};

const LB_PROMPT='The material is a university student\'s weekly Final Year Project logbook. Turn it into a simple record with one entry per week.\n\n'+
  'Reply with only JSON like:\n{"weeks":[{"week":3,"start":"2026-09-28","title":"Literature review on sensors","summary":"Read papers on strain sensors and agreed the project scope with the supervisor.","items":[{"text":"Read 4 papers on strain gauges","cat":"research"},{"text":"Supervisor meeting on project scope","cat":"meeting"}]}]}\n\n'+
  'Rules:\n- week: the week number written in the logbook; if none is written, number the entries in date order from 1.\n- start: the date of that week as YYYY-MM-DD if shown, else "".\n- title: at most 6 words.\n- summary: one plain sentence.\n- items: 1 to 6 short activities, each at most 10 words.\n- cat: one of research, design, lab, analysis, writing, meeting, admin.\n- Use only what the logbook says. Do not invent work.';
function normalizeWeeks(data){
  const arr=Array.isArray(data)?data:(data&&Array.isArray(data.weeks)?data.weeks:[]);const by={};
  arr.forEach(o=>{

    by[w]={week:w,start:isDate(String(o.start||""))?String(o.start):"",title:String(o.title||"").trim().slice(0,80),summary:String(o.summary||"").trim().slice(0,300),items};
  });

async function ingestLogbook(files){
  if(readOnly){toast("You can view this desk but not change it.");return;}

    for(const f of files){
      const nm=String(f.name||"").toLowerCase();
      if(f.type==="application/pdf"||nm.endsWith(".pdf"))text+="\n"+(await pdfRead(f,80,false)).text;
