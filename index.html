async function buildPdf(R,secs){
  const jsPDF=await loadJsPdf();const doc=new jsPDF({unit:"pt",format:"a4"});
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),M=40,C=hexRgb(R.color),NAVY=[13,27,56];
  const d=new Date(),when=d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear();
  doc.setFillColor(...NAVY);doc.rect(0,0,W,122,"F");doc.setFillColor(...C);doc.rect(0,118,W,4,"F");
  doc.setTextColor(170,186,215);doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.text(pdfTxt("DASH-IO PROGRESS REPORT  ·  "+R.kind.toUpperCase()),M,34);
  doc.setTextColor(255,255,255);doc.setFontSize(21);const tl=doc.splitTextToSize(pdfTxt(R.title),W-2*M-120);doc.text(tl.slice(0,2),M,62);
  doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(190,202,226);doc.text(pdfTxt((userName()?"Prepared for "+userName()+" · ":"")+when),M,104);
  doc.setFont("helvetica","bold");doc.setFontSize(36);doc.setTextColor(255,255,255);doc.text(R.pct+"%",W-M,72,{align:"right"});
  doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(190,202,226);doc.text("overall progress",W-M,90,{align:"right"});
  let y=148;doc.setFillColor(230,235,244);doc.roundedRect(M,y,W-2*M,10,5,5,"F");
  if(R.pct>0){doc.setFillColor(...C);doc.roundedRect(M,y,Math.max(10,(W-2*M)*R.pct/100),10,5,5,"F");}
  doc.setFontSize(9.5);doc.setTextColor(70,80,100);doc.text(pdfTxt(R.progressLabel),M,y+27);y+=46;
  const nk=R.kpis.length,gap=10,bw=(W-2*M-gap*(nk-1))/nk;
  R.kpis.forEach(([l,v],i)=>{const x=M+i*(bw+gap);doc.setFillColor(244,246,251);doc.setDrawColor(222,227,238);doc.roundedRect(x,y,bw,56,7,7,"FD");doc.setFillColor(...C);doc.rect(x,y+12,3,32,"F");
    doc.setTextColor(15,28,54);doc.setFont("helvetica","bold");doc.setFontSize(15);doc.text(pdfTxt(String(v)),x+12,y+26,{maxWidth:bw-20});doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(100,110,130);doc.text(pdfTxt(l.toUpperCase()),x+12,y+43,{maxWidth:bw-20});});
  y+=76;
  if(R.meta.length){doc.autoTable({startY:y,body:R.meta.map(r=>r.map(pdfTxt)),theme:"plain",styles:{fontSize:9.5,cellPadding:{top:3,bottom:3,left:0,right:6},textColor:[30,40,60]},columnStyles:{0:{fontStyle:"bold",cellWidth:110,textColor:[100,110,130]}},margin:{left:M,right:M}});y=doc.lastAutoTable.finalY+20;}
  const color=c=>{const v=String(c.cell.raw);if(c.section!=="body")return;if(v==="Done")c.cell.styles.textColor=[29,138,78];else if(v==="In progress"||v==="Reading")c.cell.styles.textColor=[169,106,0];else if(v==="Overdue"||/late$|past$/.test(v))c.cell.styles.textColor=[194,58,58];};
  secs.forEach(s=>{
    if(y>H-110){doc.addPage();y=56;}
    doc.setFont("helvetica","bold");doc.setFontSize(12.5);doc.setTextColor(15,28,54);doc.text(pdfTxt(s.title),M,y);const tw=doc.getTextWidth(pdfTxt(s.title));
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(120,128,145);doc.text(String(s.rows.length),M+tw+8,y);
    if(!s.rows.length){doc.text("Nothing recorded yet.",M,y+16);y+=40;return;}
    doc.autoTable({startY:y+8,head:[s.cols.map(pdfTxt)],body:s.rows.map(r=>r.map(c=>pdfTxt(c==null?"":String(c)))),theme:"striped",headStyles:{fillColor:C,textColor:255,fontStyle:"bold",fontSize:8.8},styles:{fontSize:8.6,cellPadding:4.5,overflow:"linebreak",textColor:[30,40,60],lineColor:[230,234,242]},alternateRowStyles:{fillColor:[246,248,252]},margin:{left:M,right:M,top:50},didParseCell:color});
    y=doc.lastAutoTable.finalY+26;
  });
  const pc=doc.internal.getNumberOfPages();
  for(let i=1;i<=pc;i++){doc.setPage(i);doc.setDrawColor(226,230,238);doc.line(M,H-34,W-M,H-34);doc.setFontSize(8);doc.setTextColor(140,148,165);doc.setFont("helvetica","normal");doc.text(pdfTxt("dash-io · "+R.title).slice(0,80),M,H-20);doc.text("Page "+i+" of "+pc,W-M,H-20,{align:"right"});}
  return doc.output("blob");
}
async function buildXlsx(R,secs){
  const X=await loadXlsx();const wb=X.utils.book_new();
  const sum=[["dash-io progress report"],[R.title],[R.kind],[],["Generated",new Date().toLocaleString()],["Prepared for",userName()||""],["Overall progress",R.pct/100],["Progress",R.progressLabel],[]].concat(R.meta).concat([[],["Key figures",""]]).concat(R.kpis.map(([l,v])=>[l,v]));
  const ws=X.utils.aoa_to_sheet(sum);ws["!cols"]=[{wch:24},{wch:64}];if(ws.B7)ws.B7.z="0%";ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:1}},{s:{r:1,c:0},e:{r:1,c:1}}];
  X.utils.book_append_sheet(wb,ws,"Summary");
  const used=new Set(["Summary"]);
  secs.forEach(s=>{
    const w=X.utils.aoa_to_sheet([s.cols].concat(s.rows.length?s.rows:[["Nothing recorded yet."]]));
    w["!cols"]=s.cols.map((c,i)=>({wch:Math.min(60,Math.max(10,c.length+2,...s.rows.slice(0,300).map(r=>String(r[i]==null?"":r[i]).length+2)))}));
    if(s.rows.length)w["!autofilter"]={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:s.rows.length,c:s.cols.length-1}})};
    let nm=s.title.replace(/[\\\/\?\*\[\]:]/g," ").slice(0,31);while(used.has(nm))nm=nm.slice(0,28)+" "+used.size;used.add(nm);
    X.utils.book_append_sheet(wb,w,nm);
  });
  return new Blob([X.write(wb,{bookType:"xlsx",type:"array"})],{type:MIME.xlsx});
}
const rep={k:null,secs:null,busy:""};
function openReport(k){rep.k=k;rep.secs=null;rep.busy="";renderReport();const d=document.getElementById("repDlg");try{d.showModal();}catch(e){d.setAttribute("open","");}}
function renderReport(){
  const el=document.getElementById("repBody");if(!el||!rep.k)return;const R=reportData(rep.k);
  if(!rep.secs)rep.secs=R.sections.filter(s=>s.rows.length).map(s=>s.title);
  el.innerHTML='<div class="card-head"><div><div class="eyebrow">Export progress report</div><h3>'+esc(R.title)+'</h3></div><button class="icon-btn" type="button" data-act="rep-close" aria-label="Close">✕</button></div>'+
    '<div class="rep-prev" style="--a:'+R.color+'"><div class="eyebrow" style="color:rgba(255,255,255,.75)">'+esc(R.kind)+'</div><span class="big">'+R.pct+'%</span><div class="bar"><i style="width:'+R.pct+'%"></i></div><div style="font-size:13px;opacity:.85">'+esc(R.progressLabel)+'</div></div>'+
    '<div class="sec-h">Include</div><div class="chips">'+R.sections.map(s=>'<button type="button" class="fchip" data-act="rep-sec" data-s="'+esc(s.title)+'" aria-pressed="'+rep.secs.includes(s.title)+'">'+esc(s.title)+' <span class="mono" style="opacity:.7">'+s.rows.length+'</span></button>').join("")+'</div>'+
    '<div class="rep-btns"><button class="btn primary" type="button" data-act="rep-pdf"'+(rep.busy?" disabled":"")+'>'+(rep.busy==="pdf"?'<span class="reading"><i></i><i></i><i></i></span>':'PDF report')+'<small>A designed summary to share or print</small></button><button class="btn" type="button" data-act="rep-xlsx"'+(rep.busy?" disabled":"")+'>'+(rep.busy==="xlsx"?'<span class="reading"><i></i><i></i><i></i></span>':'Excel workbook')+'<small>One sheet per section, ready to filter</small></button></div>'+
    '<div class="muted" style="font-size:12px">The summary page, progress and key figures are always included.</div>';
}
async function repExport(fmt){
  if(rep.busy)return;const R=reportData(rep.k),secs=R.sections.filter(s=>rep.secs.includes(s.title));rep.busy=fmt;renderReport();
  try{
    const blob=fmt==="pdf"?await buildPdf(R,secs):await buildXlsx(R,secs);
    const slug=String(R.title).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"progress";
    rep.busy="";renderReport();await saveFile(slug+"-progress-"+TODAY+"."+(fmt==="pdf"?"pdf":"xlsx"),blob);
  }catch(e){rep.busy="";renderReport();toast(navigator.onLine?"Couldn't make the report. Try again.":"Connect to the internet once so the report tools can load, then try again.");}
}
function repAct(a,b){
  if(a==="rep-open")openReport(b.dataset.k);
  else if(a==="rep-close")document.getElementById("repDlg").close();
  else if(a==="rep-sec"){const s=b.dataset.s,i=rep.secs.indexOf(s);if(i>=0)rep.secs.splice(i,1);else rep.secs.push(s);b.setAttribute("aria-pressed",String(i<0));}
  else if(a==="rep-pdf")repExport("pdf");
  else if(a==="rep-xlsx")repExport("xlsx");
}
/* ---------- pages ---------- */
const VIEWS={desk:"viewDesk",timetable:"viewTimetable",fyp:"viewFyp",idp:"viewIdp",music:"viewMusic"};
const REDUCED=(()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){return false;}})();
let view=null,enterT=null;
function moveInd(){
  const a=document.querySelector('.nav a[aria-current="page"]'),ind=document.getElementById("navInd");if(ind&&!a)ind.style.opacity="0";if(!a||!ind)return;
  ind.style.height=a.offsetHeight+"px";ind.style.transform="translateY("+a.offsetTop+"px)";ind.style.opacity="1";
  const nav=a.parentElement;if(nav&&nav.scrollWidth>nav.clientWidth+2)nav.scrollLeft=Math.max(0,a.offsetLeft-24);
}
function countUp(root){
  if(REDUCED||!root)return;
  root.querySelectorAll("[data-count]").forEach(el=>{
    const to=Number(el.dataset.count)||0,suf=el.dataset.suffix||"",t0=performance.now();
    const step=t=>{const p=Math.min(1,(t-t0)/900),v=Math.round(to*(1-Math.pow(1-p,3)));el.textContent=v.toLocaleString()+suf;if(p<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}
const viewElId=v=>VIEWS[v]||(isCustom(v)?"viewCustom":null);
function replayEnter(){
  const el=document.getElementById(viewElId(view));if(!el)return;
  el.classList.remove("enter");void el.offsetWidth;el.classList.add("enter");countUp(el);
  clearTimeout(enterT);enterT=setTimeout(()=>el.classList.remove("enter"),1900);
}
function setView(v){
  if(!viewElId(v))v="desk";if(loaded&&!hasPage(v))v="desk";if(v===view)return;view=v;closePdf();
  Object.entries(VIEWS).forEach(([k,id])=>{document.getElementById(id).hidden=k!==v;});document.getElementById("viewCustom").hidden=!isCustom(v);
  if(isCustom(v))renderCustomPage(v);
  document.querySelectorAll(".nav a").forEach(a=>{if(a.dataset.view===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  moveInd();replayEnter();
  const tt=document.getElementById("topTitle");if(tt)tt.textContent=isCustom(v)?pageTitle(v):{desk:"Desk",timetable:"Timetable",fyp:"FYP",idp:"IDP",music:"Music"}[v];
  if(v==="music"){renderMusic();if(spOn()&&Date.now()-SP.lastFull>60000)spRefresh(true);}
  try{document.title=(v==="desk"?"":(isCustom(v)?pageTitle(v):{timetable:"Timetable",fyp:"FYP",idp:"IDP",music:"Music"}[v])+" · ")+"dash-io";}catch(e){}
  if(v==="fyp"||v==="idp")setTimeout(()=>positionFlow(v),0);
  try{window.scrollTo(0,0);}catch(e){}
}
window.addEventListener("hashchange",()=>setView(location.hash.slice(1)));
window.addEventListener("resize",()=>{moveInd();if(view==="fyp"||view==="idp")positionFlow(view);});
setSide(MQ.matches?"closed":sidePref);
setupSideSwipe();
try{MQ.addEventListener("change",()=>setSide(MQ.matches?"closed":sidePref));}catch(e){}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveInd).catch(()=>{});
buildProjectPages();
setupImport();
tickClock();setInterval(tickClock,15000);
setView(location.hash.slice(1));

spHandleRedirect().finally(()=>{init();});
initSample();
})();
</script>

<script>
if("serviceWorker" in navigator){
  var hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(!hadController){hadController=true;return;}
    var t=document.createElement("div");t.className="toast upd";t.setAttribute("role","status");
    t.innerHTML='App updated. <button type="button" style="margin-left:8px;border:none;border-radius:6px;padding:3px 9px;font:inherit;font-weight:600;cursor:pointer">Reload</button>';
    t.querySelector("button").onclick=function(){location.reload();};document.body.appendChild(t);
  });
  addEventListener("load",function(){navigator.serviceWorker.register("sw.js").then(function(r){setInterval(function(){r.update().catch(function(){});},3600000);}).catch(function(){});});
}
(function(){
  var reduce=false;try{reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}

  var open="icons/favicon-32.png",shut="icons/favicon-32-blink.png";new Image().src=shut;
  setInterval(function(){if(document.hidden)return;link.href=shut;setTimeout(function(){link.href=open;},180);},5500);
})();
</script>
