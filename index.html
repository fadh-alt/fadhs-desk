  const share='<div class="share" title="Where your time went">'+used.map(c=>'<i style="width:'+(counts[c]/total*100).toFixed(1)+'%;background:'+LBCAT[c][1]+'"></i>').join("")+'</div><div class="ch-legend">'+used.map(c=>'<span><i style="background:'+LBCAT[c][1]+'"></i>'+LBCAT[c][0]+' '+Math.round(counts[c]/total*100)+'%</span>').join("")+'</div>';
  const rev=wk.slice().reverse(),shown=ui.lbAll?rev:rev.slice(0,4);
  const list='<div class="wk-list">'+shown.map((w,i)=>'<div class="wk" style="--i:'+i+'"><div class="wk-h"><span class="wk-n mono">W'+w.week+'</span><div style="min-width:0"><b>'+esc(w.title||"Week "+w.week)+'</b><div class="muted" style="font-size:12px">'+(isDate(w.start)?"Week of "+fmtShort(w.start)+" · ":"")+w.items.length+' activities</div></div><button class="icon-btn" type="button" data-act="lb-del" data-id="'+esc(w.id)+'" aria-label="Delete week '+w.week+'" title="Delete this week">×</button></div>'+
    (w.summary?'<p class="wk-sum">'+esc(w.summary)+'</p>':"")+(w.items.length?'<div class="chips">'+w.items.map(it=>'<span class="chip" style="--a:'+(LBCAT[it.cat]||LBCAT.admin)[1]+'"><i class="dot"></i>'+esc(it.text)+'</span>').join("")+'</div>':"")+'</div>').join("")+'</div>'+
    (rev.length>4?'<button class="btn small ghost" type="button" data-act="lb-all">'+(ui.lbAll?"Show fewer weeks":"Show all "+rev.length+" weeks")+'</button>':"");
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Logbook activities per week, by type"><g class="grid">'+g+'</g>'+bars+'</svg>'+share+'<div class="eyebrow" style="margin-top:6px">Week by week</div>'+list;
}

/* ---------- sidebar ---------- */
const MQ=(()=>{try{return matchMedia("(max-width:900px)");}catch(e){return {matches:false,addEventListener(){}};}})();
let sidePref="open";try{sidePref=localStorage.getItem("fyd.side")||"open";}catch(e){}
function setSide(state,persist){
  const sh=document.querySelector(".shell");if(!sh)return;sh.dataset.side=state;
  if(persist&&!MQ.matches){sidePref=state;try{localStorage.setItem("fyd.side",state);}catch(e){}}
  if(state==="open")setTimeout(moveInd,40);
  setTimeout(()=>{positionFlow("fyp");positionFlow("idp");},60);
}

/* ---------- timetable import ---------- */
let sampleFn=null,sampleReady=false,canImg=false,imgTypes=["image/jpeg","image/png","image/webp","image/gif"];
const imp={open:false,file:null,url:"",status:"idle",msg:"",rows:[],mode:"replace",ctl:null};
async function initSample(){
  try{sampleFn=window.claude&&window.claude.use?await window.claude.use("sample"):null;}catch(e){sampleFn=null;}
  if(sampleFn){try{const l=await sampleFn.limits();canImg=!!(l&&l.images);if(canImg&&l.images.mediaTypes&&l.images.mediaTypes.length)imgTypes=l.images.mediaTypes;}catch(e){canImg=false;}}
  try{if(canImg&&sampleFn){const l2=await sampleFn.limits();imgMax=(l2&&l2.images&&l2.images.maxCount)||5;}}catch(e){}
  try{assetsNs=window.claude&&window.claude.use?await window.claude.use("assets"):null;}catch(e){assetsNs=null;}
  sampleReady=true;renderImport();renderRefs("fyp");renderRefs("idp");renderLbPanel();
}
const IMP_ERR={
  not_granted:"Claude isn't allowed to read images for this dashboard. You can still add classes by hand with + Class.",
  sampling_disabled:"Claude isn't available on this account right now. Add classes by hand with + Class.",
  images_unavailable:"Reading images isn't available here. Open the dashboard on claude.ai, or add classes with + Class.",
  image_rejected:"That file can't be read. Use a JPG, PNG or WebP screenshot under 20 MB.",
  rate_limited:"Too many requests right now. Wait a minute, then press Read timetable again.",
  session_expired:"Sign in to claude.ai again, then press Read timetable.",
  refused:"Claude couldn't read that image. Try a different screenshot.",
  empty_completion:"No classes came back. Try a clearer screenshot.",
  invalid_json:"The answer couldn't be turned into a timetable. Press Read timetable to try again."
};
const DAYMAP={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
function normTime(t){
  const m=String(t||"").match(/(\d{1,2})\s*[:.]\s*(\d{2})\s*(am|pm)?/i);if(!m)return "";
  let h=+m[1];const mi=+m[2];
  if(m[3]){const pm=m[3].toLowerCase()==="pm";if(pm&&h<12)h+=12;if(!pm&&h===12)h=0;}
  return h>23||mi>59?"":pad(h)+":"+pad(mi);
}
function normalizeClasses(data){
  const arr=Array.isArray(data)?data:(data&&Array.isArray(data.classes)?data.classes:[]);
  return arr.map(o=>{
    if(!o||typeof o!=="object")return null;
    const d=DAYMAP[String(o.day||"").trim().slice(0,3).toLowerCase()];
    const start=normTime(o.start),end=normTime(o.end),title=String(o.title||"").trim().slice(0,120);
    if(d==null||!start||!end||end<=start||!title)return null;
    return {day:d,start,end,title,code:String(o.code||"").trim().slice(0,30),type:String(o.type||"").trim().slice(0,12),room:String(o.room||"").trim().slice(0,60),keep:true};
  }).filter(Boolean).sort((a,b)=>((a.day+6)%7)-((b.day+6)%7)||a.start.localeCompare(b.start));
}
function setImpFile(f){
  if(!f)return;
  if(imgTypes.length&&!imgTypes.includes(f.type)){imp.status="error";imp.msg="That file type can't be read. Use a JPG, PNG or WebP image.";renderImport();return;}
  if(imp.url){try{URL.revokeObjectURL(imp.url);}catch(e){}}
  imp.file=f;imp.url=URL.createObjectURL(f);imp.rows=[];imp.status="idle";imp.msg="";renderImport();
}
function closeImport(){
  if(imp.ctl)imp.ctl.abort();
  if(imp.url){try{URL.revokeObjectURL(imp.url);}catch(e){}}
  Object.assign(imp,{open:false,file:null,url:"",status:"idle",msg:"",rows:[],mode:"replace",ctl:null});renderImport();
}
async function readTimetable(){
  if(!imp.file||!sampleFn||imp.status==="reading")return;
  const ctl=new AbortController();imp.ctl=ctl;imp.status="reading";imp.msg="";imp.rows=[];renderImport();
  const prompt='The image is a university class timetable for one week. List every class session shown in it.\n\n'+
    'Reply with only a JSON array, one object per session, like this:\n'+
    '[{"day":"Tuesday","start":"08:00","end":"09:30","code":"NMB47403","title":"Additive Manufacturing","type":"Tut","room":"B206"}]\n\n'+
    'Rules:\n- day: full English weekday name.\n- start, end: 24-hour HH:MM.\n- code: the course code exactly as written, or "" if there is none.\n'+
    '- title: the course name as written.\n- type: Lec, Tut or Lab when the image shows lecture, tutorial or lab; otherwise the short label shown, or "".\n'+
    '- room: the room or location as written (for example ONLINE14), or "".\n- Skip days marked as having no class. Do not invent sessions.';
  try{
    const data=await sampleFn.json(prompt,{images:[imp.file],signal:ctl.signal});
    if(imp.ctl!==ctl)return;
    const rows=normalizeClasses(data);
    if(rows.length){imp.rows=rows;imp.status="done";}
    else{imp.status="error";imp.msg="No classes were found in that image. Try a clearer screenshot, or add classes with + Class.";}
  }catch(e){
    if(imp.ctl!==ctl)return;
    const c=e&&e.code;
    if(c==="cancelled"){imp.status="idle";}
    else{imp.status="error";imp.msg=IMP_ERR[c]||"Something went wrong while reading the image. Press Read timetable to try again.";}
  }
  imp.ctl=null;renderImport();
}
async function saveImport(){
  if(readOnly){toast("You can view this desk but not change it.");return;}
  const keep=imp.rows.filter(r=>r.keep);if(!keep.length){toast("Tick at least one class to save.");return;}
  imp.status="saving";renderImport();
  if(imp.mode==="replace"){for(const id of Object.keys(S.classes))await remove("classes",id);}
  const colorOf={};
  Object.values(S.classes).forEach(c=>{if(c&&c.color)colorOf[c.code||c.title]=Number(c.color);});
  let n=Object.keys(colorOf).length;
  for(const r of keep){
    const k=r.code||r.title;if(!colorOf[k]){colorOf[k]=(n%7)+1;n++;}
    await save("classes","c-"+newId(),{title:r.title,code:r.code,type:r.type,day:r.day,start:r.start,end:r.end,room:r.room,color:colorOf[k],createdAt:new Date().toISOString()});
  }
  closeImport();toast("Saved "+keep.length+" classes");
}
function renderImport(){
  const el=document.getElementById("imp");if(!el)return;
  el.hidden=!imp.open;if(!imp.open){el.innerHTML="";return;}
  let h='<div class="card-head"><div><h3>New timetable from an image</h3><div class="muted" style="font-size:12.5px">Add a screenshot or photo of your timetable. Claude reads it, then you check the classes before anything is saved.</div></div>'+
    '<button class="icon-btn" type="button" data-act="imp-close" aria-label="Close import">✕</button></div>';
  if(!sampleReady)h+='<div class="empty"><span class="reading"><i></i><i></i><i></i></span> Checking whether image reading is available…</div>';
  else if(!canImg)h+='<div class="note">Reading images isn\'t available in this view. Open the dashboard on claude.ai, or add classes one by one with + Class.</div>';
  else{
    const busy=imp.status==="reading"||imp.status==="saving";
    h+='<label class="drop" id="impDrop" for="impFile">'+(imp.url?'<img src="'+esc(imp.url)+'" alt="Your timetable image">':"")+
      '<span><b>'+(imp.file?esc(imp.file.name||"Pasted image"):"Choose an image")+'</b><br><span class="muted">'+(imp.file?"Click to choose a different image":"Click, drop an image here, or paste a screenshot")+'</span></span></label>'+
      '<input type="file" id="impFile" accept="'+esc(imgTypes.join(","))+'" hidden'+(busy?" disabled":"")+'>';
    if(imp.status==="reading")h+='<div class="imp-actions"><span class="reading"><i></i><i></i><i></i></span><span>Reading your timetable. This can take up to a minute.</span><button class="btn small" type="button" data-act="imp-stop">Stop</button></div>';
    else if(imp.status!=="done"&&imp.status!=="saving")h+='<div class="imp-actions"><button class="btn primary" type="button" data-act="imp-read"'+(imp.file?"":" disabled")+'>Read timetable</button>'+(imp.file?"":'<span class="muted" style="font-size:12.5px">Choose an image first.</span>')+'</div>';
    if(imp.status==="error")h+='<div class="note">'+esc(imp.msg)+'</div>';
    if(imp.rows.length&&(imp.status==="done"||imp.status==="saving")){
      const n=imp.rows.filter(r=>r.keep).length;
      h+='<div><div class="eyebrow" style="margin-bottom:6px">Found '+imp.rows.length+' classes · untick any that are wrong</div><div class="prev">'+
        imp.rows.map((r,ix)=>'<label class="prev-row"><input type="checkbox" class="check" data-imp-keep="'+ix+'"'+(r.keep?" checked":"")+(busy?" disabled":"")+'><span style="min-width:0"><span class="name">'+esc(r.title)+(r.code?' <span class="mono muted" style="font-weight:500">'+esc(r.code)+'</span>':"")+'</span><span class="when">'+DOW[r.day]+' '+r.start+'–'+r.end+(r.type?' · '+esc(r.type):"")+(r.room?' · '+esc(r.room):"")+'</span></span></label>').join("")+'</div></div>'+
        '<div class="modes" role="radiogroup" aria-label="How to save"><label><input type="radio" name="impMode" value="replace"'+(imp.mode==="replace"?" checked":"")+(busy?" disabled":"")+'> Replace my current timetable</label><label><input type="radio" name="impMode" value="add"'+(imp.mode==="add"?" checked":"")+(busy?" disabled":"")+'> Add to my current timetable</label></div>'+
        '<div class="imp-actions">'+(imp.status==="saving"?'<span class="reading"><i></i><i></i><i></i></span><span>Saving…</span>':'<button class="btn primary" type="button" data-act="imp-save"'+(n?"":" disabled")+'>Save '+n+' classes</button><button class="btn" type="button" data-act="imp-read">Read again</button>')+
        '<span class="muted" style="font-size:12.5px">You can edit any class after saving. Remember to update the semester start in Settings.</span></div>';
    }
  }
  el.innerHTML=h;
  const fi=document.getElementById("impFile");if(fi)fi.addEventListener("change",()=>{if(fi.files&&fi.files[0])setImpFile(fi.files[0]);});
  const dz=document.getElementById("impDrop");
  if(dz){
    dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over");});
    dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
    dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f&&imp.status!=="reading"&&imp.status!=="saving")setImpFile(f);});
  }
}
document.getElementById("imp").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.impKeep!=null){const r=imp.rows[Number(t.dataset.impKeep)];if(r){r.keep=t.checked;renderImport();}}
  else if(t.name==="impMode"){imp.mode=t.value;}
});
document.addEventListener("paste",e=>{
  if(!imp.open||!canImg||imp.status==="reading"||imp.status==="saving")return;
  const files=e.clipboardData&&e.clipboardData.files?Array.from(e.clipboardData.files):[];
  const f=files.find(x=>x.type&&x.type.indexOf("image/")===0);
  if(f){e.preventDefault();setImpFile(f);}
});

/* ---------- pages ---------- */
const VIEWS={desk:"viewDesk",timetable:"viewTimetable",fyp:"viewFyp",idp:"viewIdp"};
const REDUCED=(()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){return false;}})();
let view=null,enterT=null;
function moveInd(){
  const a=document.querySelector('.nav a[aria-current="page"]'),ind=document.getElementById("navInd");if(!a||!ind)return;
  ind.style.width=a.offsetWidth+"px";ind.style.height=a.offsetHeight+"px";ind.style.transform="translate("+a.offsetLeft+"px,"+a.offsetTop+"px)";
  const nav=a.parentElement;if(nav&&nav.scrollWidth>nav.clientWidth+2)nav.scrollLeft=Math.max(0,a.offsetLeft-24);
}
function countUp(root){
  if(REDUCED||!root)return;
  root.querySelectorAll("[data-count]").forEach(el=>{
    const to=Number(el.dataset.count)||0,suf=el.dataset.suffix||"",t0=performance.now();
    const step=t=>{const p=Math.min(1,(t-t0)/900),v=Math.round(to*(1-Math.pow(1-p,3)));el.textContent=v.toLocaleString()+suf;if(p<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}
function replayEnter(){
  const el=document.getElementById(VIEWS[view]);if(!el)return;
  el.classList.remove("enter");void el.offsetWidth;el.classList.add("enter");countUp(el);
  clearTimeout(enterT);enterT=setTimeout(()=>el.classList.remove("enter"),1900);
}
function setView(v){
  if(!VIEWS[v])v="desk";if(v===view)return;view=v;
  Object.entries(VIEWS).forEach(([k,id])=>{document.getElementById(id).hidden=k!==v;});
  document.getElementById("hero").hidden=v!=="desk";
  document.querySelectorAll(".nav a").forEach(a=>{if(a.dataset.view===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  moveInd();replayEnter();
  const tt=document.getElementById("topTitle");if(tt)tt.textContent={desk:"Desk",timetable:"Timetable",fyp:"FYP",idp:"IDP"}[v];
  if(v==="fyp"||v==="idp")setTimeout(()=>positionFlow(v),0);
  try{window.scrollTo(0,0);}catch(e){}
}
document.querySelectorAll(".nav a").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();setView(a.dataset.view);if(MQ.matches)setSide("closed");try{location.hash=a.dataset.view;}catch(err){}}));
window.addEventListener("hashchange",()=>setView(location.hash.slice(1)));
window.addEventListener("resize",()=>{moveInd();if(view==="fyp"||view==="idp")positionFlow(view);});
setSide(MQ.matches?"closed":sidePref);
try{MQ.addEventListener("change",()=>setSide(MQ.matches?"closed":sidePref));}catch(e){}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveInd).catch(()=>{});
buildProjectPages();
setupImport();
tickClock();setInterval(tickClock,15000);
setView(location.hash.slice(1));

init();
initSample();
})();
</script>

<script>
if("serviceWorker" in navigator){
  var hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(!hadController){hadController=true;return;}
    var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");
    t.innerHTML='App updated. <button type="button" style="margin-left:8px;border:none;border-radius:6px;padding:3px 9px;font:inherit;font-weight:600;cursor:pointer">Reload</button>';
    t.querySelector("button").onclick=function(){location.reload();};document.body.appendChild(t);
  });
  addEventListener("load",function(){navigator.serviceWorker.register("sw.js").then(function(r){setInterval(function(){r.update().catch(function(){});},3600000);}).catch(function(){});});
}
</script>
