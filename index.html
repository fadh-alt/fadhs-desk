<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>dash-io</title>
<meta name="description" content="dash-io: your personal desk for tasks, calendar, timetable, projects and music.">
<meta name="theme-color" content="#0d1b38">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="dash-io">
<meta name="application-name" content="dash-io">
<style>
html{background:#081329}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<script>window.FYD_PWA=true;</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* dash-io: frosted-glass panels floating over a slow ambient backdrop. Palette (data-palette) and light/dark (data-mode) live on <html>. */
@property --t-base{syntax:"<color>";inherits:true;initial-value:#081329}
@property --t-base2{syntax:"<color>";inherits:true;initial-value:#14274f}
@property --t-g1{syntax:"<color>";inherits:true;initial-value:#3d6be0}
@property --t-g2{syntax:"<color>";inherits:true;initial-value:#7a5af0}
@property --t-g3{syntax:"<color>";inherits:true;initial-value:#2bb3c9}
:root{
  --t-base:#081329; --t-base2:#14274f; --t-g1:#3d6be0; --t-g2:#7a5af0; --t-g3:#2bb3c9;
  transition:--t-base .9s ease,--t-base2 .9s ease,--t-g1 .9s ease,--t-g2 .9s ease,--t-g3 .9s ease;
  --bg:var(--t-base);
  --surface:rgba(255,255,255,.065); --solid:color-mix(in srgb, var(--t-base2) 62%, var(--t-base)); --sunk:rgba(255,255,255,.06);
  --ink:#f2f5fb; --muted:rgba(222,230,246,.64); --line:rgba(255,255,255,.1);
  --accent:#ffffff; --accent-ink:#0b1630; --accent-soft:rgba(255,255,255,.12);
  --navy:var(--t-base2); --on-navy:#ffffff; --on-navy-muted:rgba(226,233,247,.7); --navy-line:rgba(255,255,255,.2); --navy-soft:rgba(255,255,255,.1);
  --side:color-mix(in srgb, var(--t-base) 58%, transparent); --glass-shadow:0 24px 60px -34px rgba(0,0,0,.8);
  --glow1:color-mix(in srgb, var(--t-g1) 55%, transparent); --glow2:color-mix(in srgb, var(--t-g2) 42%, transparent);
  --grid-dot:rgba(255,255,255,.12); --scrim-bg:rgba(2,6,16,.6); --cap-bg:rgba(4,9,22,.86);
  --amb:.55;
  --work:#e6a23c; --fyp:#6aa2ff; --idp:#3fc79f; --personal:#ef7fb0; --src:#b79bff; --study:#4fd8cf;
  --c1:#ff9d5c; --c2:#4fd8cf; --c3:#9bdc4b; --c4:#74a8ff; --c5:#b794ff; --c6:#f2c94c; --c7:#ff7fb0;
  --danger:#ff8080; --danger-soft:rgba(255,110,110,.14); --ok:#5fd394; --ok-soft:rgba(95,211,148,.14); --warn:#f0b450; --warn-soft:rgba(240,180,80,.14);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:22px;
  color-scheme:dark;
}
:root[data-mode="light"]{
  --bg:color-mix(in srgb, var(--t-base2) 9%, #eef1f7);
  --surface:rgba(255,255,255,.62); --solid:#ffffff; --sunk:color-mix(in srgb, var(--t-base2) 6%, transparent);
  --ink:#0f1c36; --muted:#56627c; --line:color-mix(in srgb, var(--t-base2) 13%, transparent);
  --accent:var(--t-base2); --accent-ink:#ffffff; --accent-soft:color-mix(in srgb, var(--t-base2) 11%, transparent);
  --side:color-mix(in srgb, var(--t-base) 84%, transparent); --glass-shadow:0 22px 50px -32px rgba(15,28,54,.4);
  --scrim-bg:rgba(4,10,26,.45); --amb:.3;
  --work:#b56f06; --fyp:#2f6fd6; --idp:#11886a; --personal:#c0407a; --src:#7046c8; --study:#0e8f8a;
  --c1:#c2620d; --c2:#0e8f8a; --c3:#4d8a12; --c4:#2f6fd6; --c5:#7a4fd0; --c6:#a87b00; --c7:#c93d7c;
  --danger:#c23a3a; --danger-soft:#fbe8e8; --ok:#1d8a4e; --ok-soft:#e3f4ea; --warn:#a96a00; --warn-soft:#fbf0dc;
  color-scheme:light;
}
:root[data-palette="ocean"]{--t-base:#04162a;--t-base2:#0b3150;--t-g1:#1d94d0;--t-g2:#26c6ae;--t-g3:#3c5fe0}
:root[data-palette="sage"]{--t-base:#0a1915;--t-base2:#1b3a30;--t-g1:#3fa37a;--t-g2:#b8b06a;--t-g3:#2e8a9a}
:root[data-palette="plum"]{--t-base:#140b22;--t-base2:#2b1745;--t-g1:#9a5cf0;--t-g2:#e0609e;--t-g3:#5c6ef0}
:root[data-palette="dusk"]{--t-base:#190e19;--t-base2:#3a1f35;--t-g1:#e0708f;--t-g2:#f0a960;--t-g3:#8a63d0}
:root[data-palette="clay"]{--t-base:#190f0b;--t-base2:#3a2219;--t-g1:#e07a4c;--t-g2:#b9506c;--t-g3:#d0a457}
:root[data-palette="graphite"]{--t-base:#0e1014;--t-base2:#262a33;--t-g1:#6d7c96;--t-g2:#9a8fb0;--t-g3:#56808c}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bg)}
.amb i{position:absolute;width:72vmax;height:72vmax;border-radius:50%;opacity:var(--amb);will-change:transform}
.amb i:nth-child(1){left:-24vmax;top:-30vmax;background:radial-gradient(closest-side,var(--t-g1),transparent);animation:ambA 26s ease-in-out infinite alternate}
.amb i:nth-child(2){right:-30vmax;top:8vh;background:radial-gradient(closest-side,var(--t-g2),transparent);opacity:calc(var(--amb)*.8);animation:ambB 32s ease-in-out infinite alternate}
.amb i:nth-child(3){left:18vw;bottom:-40vmax;background:radial-gradient(closest-side,var(--t-g3),transparent);opacity:calc(var(--amb)*.7);animation:ambC 38s ease-in-out infinite alternate}
@keyframes ambA{to{transform:translate3d(14vw,12vh,0) scale(1.15)}}
@keyframes ambB{to{transform:translate3d(-16vw,18vh,0) scale(.9)}}
@keyframes ambC{to{transform:translate3d(12vw,-14vh,0) scale(1.2)}}
.wrap{max-width:1320px;margin:0 auto;padding-block:6px 48px;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.top .sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px;color:var(--muted)}
.chip-week{font-family:var(--f-mono);font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:999px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--danger);border-color:var(--danger)}

/* greeting band */
.hero{background:var(--navy);color:var(--on-navy)}
.hero-in{max-width:1280px;margin:0 auto;padding-block:28px 26px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.greet{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:640px}
.hero .eyebrow{color:var(--on-navy-muted)}
.hero h1{font-size:34px;color:var(--on-navy)}
.hero .msg{margin:0;font-size:15px;color:var(--on-navy)}
.hero .quote{margin:0;font-size:13px;color:var(--on-navy-muted);font-style:italic}
.hero .sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.hero .chip-week{background:var(--navy-soft);color:var(--on-navy)}
.hero .btn{background:transparent;color:var(--on-navy);border-color:var(--navy-line)}
.hero .btn:hover{border-color:var(--on-navy)}
.hero .btn.primary{background:var(--on-navy);color:var(--navy);border-color:var(--on-navy)}
.hero .btn.ghost{border-color:transparent;color:var(--on-navy-muted)}
.hero .btn.ghost:hover{background:var(--navy-soft);color:var(--on-navy)}

.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:9px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note.info{background:var(--accent-soft);color:var(--accent)}

/* summary */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile .line{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.tile .line b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bar{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.good{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.plain{background:var(--sunk);color:var(--muted)}

/* desk */
.desk{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* area markers */
.a-work{--a:var(--work)} .a-study{--a:var(--study)} .a-music{--a:var(--c2)} .a-fyp{--a:var(--fyp)} .a-idp{--a:var(--idp)} .a-src{--a:var(--src)} .a-personal{--a:var(--personal)}
.tag{font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--a,var(--muted));border:1px solid currentColor;border-radius:5px;padding:0 5px;white-space:nowrap;line-height:17px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--a,var(--muted));display:inline-block;flex:none}

/* todo */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.quick{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px}
.field{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
.group{display:flex;flex-direction:column}
.group-h{display:flex;align-items:center;gap:8px;padding:8px 2px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.group-h.bad{color:var(--danger)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line)}
.group .row:first-of-type{border-top:none}
.row .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t span.title{overflow-wrap:anywhere}
.row.done .title{text-decoration:line-through;color:var(--muted)}
.row .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.row .meta .due.bad{color:var(--danger);font-weight:600}
.row .meta .due.today{color:var(--accent);font-weight:600}
.row .row-act{display:flex;gap:2px;align-items:center}
.prio{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--danger)}
.check{appearance:none;width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-content:center;margin:0;cursor:pointer;background:transparent}
.check:checked{background:var(--ok);border-color:var(--ok)}
.check:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:translateY(-1px) rotate(-45deg)}
.icon-btn{border:none;background:transparent;color:var(--muted);border-radius:6px;width:28px;height:28px;display:grid;place-items:center}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.empty{color:var(--muted);padding:14px 4px;font-size:13px}

/* projects */
.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.proj{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative;overflow:hidden}
.proj::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--a)}
.proj .ph{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.proj .pct{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;color:var(--a)}
.proj .bar>i{background:var(--a)}
.ms{display:flex;flex-direction:column}
.ms-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line);font-size:13px}
.ms-row:first-child{border-top:none}
.ms-row .title{overflow-wrap:anywhere}
.ms-row.done .title{color:var(--muted);text-decoration:line-through}
.status{border:none;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.status.todo{background:var(--sunk);color:var(--muted)}
.status.doing{background:var(--warn-soft);color:var(--warn)}
.status.done{background:var(--ok-soft);color:var(--ok)}
.words{display:flex;flex-direction:column;gap:5px;background:var(--sunk);border-radius:8px;padding:9px 10px}
.words .line{display:flex;justify-content:space-between;font-size:12.5px;gap:8px}

/* calendar */
.cal-nav{display:flex;align-items:center;gap:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dow{font-size:11px;text-align:center;color:var(--muted);font-weight:600;padding-bottom:2px;letter-spacing:.04em}
.cell{border:1px solid transparent;background:var(--bg);border-radius:7px;min-height:52px;padding:4px 5px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left}
.cell:hover{border-color:var(--line)}
.cell .n{font-family:var(--f-mono);font-size:12px}
.cell.out{opacity:.4}
.cell.today .n{background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 4px}
.cell.sel{border-color:var(--accent);background:var(--accent-soft)}
.cell .dots{display:flex;gap:3px;flex-wrap:wrap}
.cell{min-width:0;overflow:hidden;min-height:74px}
.cell .evs{display:flex;flex-direction:column;gap:2px;width:100%;min-width:0}
.ev{display:block;width:100%;min-width:0;font-size:10.5px;line-height:1.35;padding:0 4px;border-left:2px solid var(--a);border-radius:2px;background:var(--surface);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.sel .ev{background:var(--surface)}
@media (max-width:640px){.cell{min-height:60px;padding:3px}.ev{font-size:9.5px;padding:0 2px}}
.cell .more{font-size:10px;color:var(--muted);font-family:var(--f-mono)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* agenda */
.agenda{display:flex;flex-direction:column}
.ag-row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ag-row:first-child{border-top:none}
.ag-row .time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ag-row .t{display:flex;gap:8px;align-items:center;min-width:0}
.ag-row .t .title{overflow-wrap:anywhere}
.ag-row .kind{font-size:11px;color:var(--muted)}
.ag-row.past{opacity:.55}
.addcal{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px 72px;padding:8px 10px;background:var(--accent-soft);border-radius:8px;font-size:12.5px}
.addcal a{color:var(--ink);font-weight:600;text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 9px}
.addcal a:hover{border-color:var(--ink)}
.addcal .hint{color:var(--muted);font-size:11.5px;width:100%}
.icon-btn[aria-expanded="true"]{background:var(--accent-soft);color:var(--ink)}
@media (max-width:640px){.addcal{margin-left:0}}
.ag-row.now{position:relative}
.now-line{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--danger);padding:2px 0}
.now-line::after{content:"";flex:1;height:1px;background:var(--danger)}

/* routines */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wday{background:var(--bg);border-radius:8px;padding:7px;display:flex;flex-direction:column;gap:5px;min-width:0;min-height:70px}
.wday.today{outline:1.5px solid var(--accent)}
.wday .h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rt{border:none;text-align:left;background:var(--surface);border-left:3px solid var(--a);border-radius:4px;padding:3px 5px;font-size:11.5px;line-height:1.3;display:flex;flex-direction:column;min-width:0}
.rt .mono{font-size:10.5px;color:var(--muted)}
.rt span:last-child{overflow-wrap:anywhere}

/* dialog */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(480px, calc(100vw - 32px));max-height:calc(100dvh - 32px);overflow:auto}
dialog::backdrop{background:rgba(10,14,22,.45)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px}
.fl{display:flex;flex-direction:column;gap:4px}
.fl label,.fl .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.fl-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:12.5px;color:var(--ink);font-weight:500}
.dlg-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:4px}

}

.view{display:flex;flex-direction:column;gap:18px;min-width:0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* timetable */

.tt{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:14px;align-items:start}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}

.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.track{position:relative;height:6px;border-radius:999px;background:var(--sunk)}
.seg{position:absolute;top:0;bottom:0;border-radius:999px;transform-origin:left center}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--danger)}
.track-ends{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:4px}
.cls-list{display:flex;flex-direction:column;gap:2px}
.cls{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:none;background:transparent;padding:8px 6px;border-radius:8px;transition:transform .2s,background .2s}
.cls:hover{background:var(--sunk);transform:translateX(3px)}

.cls .name{display:block;font-weight:600;overflow-wrap:anywhere}
.cls .sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;margin-top:2px}

/* import */
.imp{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;cursor:pointer;transition:border-color .2s,background .2s}

.imp-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.reading{display:inline-flex;gap:4px;align-items:center}
.reading i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.1s infinite}

@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.prev{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;max-height:360px;overflow:auto}
.prev-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer}

/* shell + floating glass rail */
.shell{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;position:relative;z-index:1;min-height:100vh}
.main{min-width:0}
.side{position:sticky;top:14px;margin:14px 0 14px max(14px, env(safe-area-inset-left, 0px));height:calc(100vh - 28px);width:236px;border-radius:28px;background:var(--side);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);box-shadow:var(--glass-shadow);color:var(--on-navy);display:flex;flex-direction:column;gap:20px;padding:18px 12px;overflow-x:hidden;overflow-y:auto;isolation:isolate;scrollbar-width:none;transition:width .5s cubic-bezier(.32,.72,0,1)}
.side::-webkit-scrollbar{display:none}
.side::before{content:"";position:absolute;left:-60%;right:-60%;bottom:0;height:55%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side at 50% 85%, var(--glow1), transparent);animation:breatheO 9s ease-in-out infinite alternate}
@keyframes breatheO{from{opacity:.35}to{opacity:.8}}
@keyframes breathe{from{transform:translateY(10%) scale(.9);opacity:.35}to{transform:translateY(-5%) scale(1.1);opacity:.75}}
.brand{display:flex;gap:12px;align-items:center;padding:2px 7px;color:var(--on-navy);text-decoration:none;min-width:0}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:-.02em}
.mark{width:38px;height:38px;flex:none;display:block}
.mark .eyes,.mascot .eyes,.sp-mark .eyes{transform-box:fill-box;transform-origin:center;animation:blinkEye 5.5s ease-in-out infinite}
.mark .bob,.mascot .bob{animation:bob 4s ease-in-out infinite}
@keyframes blinkEye{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.12)}96%{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.lbl{white-space:nowrap;transition:opacity .25s ease,transform .4s cubic-bezier(.32,.72,0,1)}
.nav{display:flex;flex-direction:column;gap:4px;position:relative}
.nav a,.nav-btn{position:relative;z-index:1;display:flex;gap:14px;align-items:center;height:48px;padding:0 15px;border:none;background:transparent;border-radius:16px;color:var(--on-navy-muted);text-decoration:none;font-weight:500;font-size:14px;transition:color .25s,background .25s;width:100%;text-align:left}
.nav a svg,.nav-btn svg{flex:none;width:20px;height:20px;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.nav a:hover,.nav-btn:hover{color:var(--on-navy)}
.nav-btn:hover{background:rgba(255,255,255,.07)}

.nav .k{margin-left:auto;font-size:11px;color:var(--on-navy-muted)}
.nav .ind{position:absolute;left:0;right:0;top:0;height:48px;border-radius:16px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 10px 24px -14px var(--glow1);transition:transform .5s cubic-bezier(.3,.7,.2,1),opacity .3s}
.nav a.new{animation:sideIn .55s cubic-bezier(.22,.8,.22,1) both}
.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.topbar{display:flex;position:relative;z-index:14;align-items:center;gap:12px;padding:22px max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px));max-width:1320px;margin:0 auto;color:var(--ink)}
.topbar .page-title{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-r{margin-left:auto;display:flex;gap:10px;align-items:center}
.top-clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;font-size:11.5px;color:var(--muted)}
.top-clock b{font-family:var(--f-mono);font-weight:500;font-size:15px;color:var(--ink)}
.clock .colon,.top-clock .colon{animation:blink 2s steps(1) infinite}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--ink);display:grid;place-items:center;flex:none;transition:transform .25s,border-color .25s}
.round:hover{transform:translateY(-1px);border-color:var(--muted)}
.avatar{font-family:var(--f-display);font-weight:700;font-size:15px;background:linear-gradient(135deg,var(--t-g1),var(--t-g2));color:#fff;border-color:rgba(255,255,255,.25)}
.menu-btn{display:none}
.scrim{display:none}
@media (min-width:901px){
  .shell[data-side="closed"] .side{width:76px}
  .shell[data-side="closed"] .side .lbl,.shell[data-side="closed"] .side .k{opacity:0;transform:translateX(-8px);pointer-events:none}
  .side-collapse svg{transition:transform .5s cubic-bezier(.32,.72,0,1)}

}
@media (max-width:900px){
  .shell{display:block}
  .topbar{position:sticky;top:0;padding:calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px));background:color-mix(in srgb, var(--bg) 70%, transparent);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--line);max-width:none}
  .topbar .page-title{font-size:19px}

  .menu-btn:active{transform:scale(.92)}
  .wrap{padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px));padding-top:14px}
  .side,.shell[data-side="closed"] .side{display:flex;position:fixed;top:0;left:0;bottom:0;margin:0;height:auto;width:min(290px,84vw);border-radius:0 28px 28px 0;z-index:30;transform:translate3d(-105%,0,0);visibility:hidden;transition:transform .44s cubic-bezier(.32,.72,0,1),box-shadow .44s,visibility 0s linear .44s;will-change:transform;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-top:calc(22px + env(safe-area-inset-top, 0px));padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px));background:color-mix(in srgb, var(--t-base) 82%, transparent)}
  .shell[data-side="open"] .side{transform:translate3d(0,0,0);visibility:visible;transition:transform .44s cubic-bezier(.32,.72,0,1),box-shadow .44s,visibility 0s;box-shadow:16px 0 44px -12px var(--scrim-bg)}
  .scrim{display:block;position:fixed;inset:0;z-index:29;background:var(--scrim-bg);opacity:0;pointer-events:none;transition:opacity .44s ease;-webkit-tap-highlight-color:transparent}
  .shell[data-side="open"] .scrim{opacity:1;pointer-events:auto}
  .side.dragging,.scrim.dragging{transition:none!important}
  .side-collapse{display:none!important}
}
@keyframes sideIn{from{opacity:0;transform:translate3d(-16px,0,0)}}
.shell[data-side="open"] .side>*{animation:sideIn .5s cubic-bezier(.22,.8,.22,1) both}
.shell[data-side="open"] .side>:nth-child(2){animation-delay:.04s}
.shell[data-side="open"] .side>:nth-child(3){animation-delay:.08s}
.shell[data-side="open"] .side>:nth-child(4){animation-delay:.12s}

/* ambient motion on navy bands */
.band{position:relative;overflow:hidden;isolation:isolate}
.band::before{content:"";position:absolute;inset:-50%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 30% 40%, var(--glowA, var(--glow1)), transparent 32%),radial-gradient(circle at 68% 62%, var(--glow2), transparent 30%);animation:drift 24s ease-in-out infinite alternate}
.band::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(var(--grid-dot) 1px, transparent 1.4px);background-size:22px 22px;-webkit-mask-image:linear-gradient(100deg,transparent 30%,#000 85%);mask-image:linear-gradient(100deg,transparent 30%,#000 85%);animation:pan 60s linear infinite}
@keyframes drift{0%{transform:translate(-4%,2%) rotate(0deg)}100%{transform:translate(6%,-4%) rotate(10deg)}}
@keyframes pan{to{background-position:440px 0}}
.a-fyp.band{--glowA:color-mix(in srgb, var(--fyp) 60%, transparent)}
.a-idp.band{--glowA:color-mix(in srgb, var(--idp) 60%, transparent)}

/* project page header */
.phero{background:var(--navy);color:var(--on-navy);border-radius:14px;padding:24px;display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-end}
.phero h1{font-size:30px;color:var(--on-navy)}
.phero .eyebrow{color:var(--on-navy-muted)}
.phero .meta{margin:0;color:var(--on-navy-muted);font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.phero .meta b{color:var(--on-navy)}
.phero .beacon{--a:var(--on-navy)}
.phero-r{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.countdown{text-align:right}
.cd-n{display:block;font-family:var(--f-display);font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.countdown small{color:var(--on-navy-muted);font-size:12px}
.phero .btn{background:transparent;color:var(--on-navy);border-color:var(--navy-line)}
.phero .btn:hover{border-color:var(--on-navy)}

/* KPI rings */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:14px;align-items:center;min-width:0}
.ringw{position:relative;width:76px;height:76px;flex:none}
.ring{width:100%;height:100%;display:block}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--sunk)}
.ring .v{stroke:var(--a);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50px 50px;transition:stroke-dashoffset .9s cubic-bezier(.2,.7,.2,1)}
.ring-n{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:500}
.kv{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.ks{font-size:12px;color:var(--muted)}
@keyframes ringin{from{stroke-dashoffset:100}}
.view.enter .ring .v{animation:ringin 1.3s cubic-bezier(.2,.7,.2,1) both}
.view.enter .kpi{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.08s + var(--i,0)*.07s)}
.pgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}

/* charts */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.chart .lbl{fill:var(--ink);font-size:11px}
.chart .lbl.strong{font-weight:600;fill:var(--a);font-size:12px}
.chart .ln{fill:none;stroke:var(--a);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.chart .area{fill:var(--a);opacity:.12}
.chart .pace{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5}
.chart .goal{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.chart .pt{fill:var(--surface);stroke:var(--a);stroke-width:2}
.chart .end{fill:var(--a);stroke:var(--surface);stroke-width:2}
.chart .pulse{fill:var(--a);transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.chart .today{stroke:var(--danger);stroke-width:1;stroke-dasharray:2 3}
.chart .lbl-today{fill:var(--danger)}
.chart .bar-b{transform-box:fill-box;transform-origin:center bottom}
.chart .wk-now{fill:var(--ink);font-weight:600}
.ch-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.ch-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}
@keyframes risey{from{transform:scaleY(0)}}
@keyframes pulse{0%{transform:scale(1);opacity:.45}100%{transform:scale(3.2);opacity:0}}
.view.enter .chart .ln{animation:draw 1.5s .25s cubic-bezier(.45,.05,.2,1) both}
.view.enter .chart .area{animation:fadein 1s 1s both}
.view.enter .chart .pt,.view.enter .chart .end,.view.enter .chart .pace,.view.enter .chart .goal,.view.enter .chart .lbl{animation:fadein .6s 1.2s both}
.view.enter .chart .bar-b{animation:risey .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.2s + var(--i,0)*.06s)}

/* milestone timeline */
.tl{display:flex;flex-direction:column}
.tl-item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;position:relative;padding-bottom:16px}
.tl-item::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line);transform-origin:top}
.tl-item:last-child{padding-bottom:0}
.tl-item:last-child::before{display:none}
.tl-item.done::before{background:var(--a)}
.tl-dot{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--a);background:var(--surface);margin:2px 3px;position:relative}
.tl-item.done .tl-dot{background:var(--a)}
.tl-item.todo .tl-dot{border-color:var(--line)}
.tl-item.doing .tl-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--a);animation:ping 1.8s ease-out infinite}
.tl-item .title{font-weight:600;overflow-wrap:anywhere}
.tl-item.done .title{color:var(--muted)}
@keyframes growy{from{transform:scaleY(0)}}
.view.enter .tl-item{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.2s + var(--i,0)*.07s)}
.view.enter .tl-item.done::before{animation:growy .6s both;animation-delay:calc(.35s + var(--i,0)*.07s)}

/* references */
.stack{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--sunk);gap:2px}
.stack i{display:block;height:100%;transform-origin:left center}

<script>
(function(){
const AREAS={work:"Work",study:"Study",fyp:"FYP",idp:"IDP",src:"SRC",personal:"Personal"};
const COLLS=["tasks","events","milestones","routines","projects","classes","refs","logbook","pages","docs"];
const S={tasks:{},events:{},milestones:{},routines:{},projects:{},classes:{},refs:{},logbook:{},pages:{},docs:{}};
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
let db=null, mode="loading", readOnly=false, loaded=false;
const PWA=!!window.FYD_PWA;
const idb={
  open(){if(!this.p)this.p=new Promise((res,rej)=>{const r=indexedDB.open("fyd-store",1);r.onupgradeneeded=()=>{r.result.createObjectStore("pdf");r.result.createObjectStore("kv");};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}).catch(e=>{this.p=null;throw e;});return this.p;},
  async run(store,mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const q=fn(t.objectStore(store));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  put(s,k,v){return this.run(s,"readwrite",st=>st.put(v,k));},
  get(s,k){return this.run(s,"readonly",st=>st.get(k));},
  del(s,k){return this.run(s,"readwrite",st=>st.delete(k));}
};

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1);};
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||"");
const TODAY=ymd(new Date());
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtShort=s=>{const d=parse(s);return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const areaOf=a=>AREAS[a]?a:(S.pages&&S.pages[a]&&!S.pages[a].archived?a:"personal");
const areaName=a=>AREAS[a]||(S.pages&&S.pages[a]&&S.pages[a].title)||"Personal";

const ui={filter:"all",showDone:false,calMonth:TODAY.slice(0,7)+"-01",selDay:TODAY};
try{const f=localStorage.getItem("fyd.filter");if(f&&(f==="all"||AREAS[f]||/^p-/.test(f)))ui.filter=f;}catch(e){}

function dueLabel(due){
  if(!isDate(due))return {text:"No date",cls:""};
  const n=daysBetween(TODAY,due);
  if(n<0)return {text:"Overdue "+(-n)+"d",cls:"bad"};
  if(n===0)return {text:"Today",cls:"today"};
  if(n===1)return {text:"Tomorrow",cls:""};
  return {text:fmtShort(due),cls:""};
}
const dMinus=n=>n<0?"D+"+(-n):n===0?"D-day":"D-"+n;

/* ---------- storage ---------- */
const queues={};
function enqueue(key,fn){const p=(queues[key]||Promise.resolve()).catch(()=>{}).then(fn);queues[key]=p;return p;}
function onWriteError(e){
  if(e&&e.code==="invalid_argument"){readOnly=true;toast("You can view this desk but not change it.");}
  else if(e&&e.code==="quota_exceeded"){toast("Storage is full. Delete some old items and try again.");}
  else toast("Could not save. Check your connection and try again.");
}
function save(c,id,data){
  S[c]=Object.assign({},S[c],{[id]:data});render();
  if(mode==="db"){return enqueue(c+"/"+id,()=>db.collection(c).doc(id).set(data)).catch(onWriteError);}
  saveLocal();return Promise.resolve();
}
function remove(c,id){
  const m=Object.assign({},S[c]);delete m[id];S[c]=m;render();
  if(mode==="db"){return enqueue(c+"/"+id,()=>db.collection(c).doc(id).delete()).catch(onWriteError);}
  saveLocal();return Promise.resolve();
}
function applyState(o){if(o&&typeof o==="object")COLLS.forEach(c=>{if(o[c]&&typeof o[c]==="object")S[c]=o[c];});}
let saveT=null;
function saveLocal(){
  if(PWA){clearTimeout(saveT);saveT=setTimeout(()=>{idb.put("kv","state",S).catch(()=>{try{localStorage.setItem("fyd.local",JSON.stringify(S));}catch(e){toast("Couldn't save on this device. Storage may be full.");}});},150);return;}
  try{localStorage.setItem("fyd.local",JSON.stringify(S));}catch(e){}
}
async function loadLocal(){
  if(PWA){try{const o=await idb.get("kv","state");if(o){applyState(o);return;}}catch(e){}}
  try{const raw=localStorage.getItem("fyd.local");if(raw)applyState(JSON.parse(raw));}catch(e){}
}
async function exportData(){
  const data=JSON.stringify({app:"dash-io",version:1,exportedAt:new Date().toISOString(),data:S});
  const name="dash-io-backup-"+TODAY+".json";
  if(!PWA){
    let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;}catch(e){dl=null;}

const BYDAY=["SU","MO","TU","WE","TH","FR","SA"];
function calTitle(i){return i.kind==="Task due"?"Due: "+i.title:i.kind==="Final deadline"?i.title+" submission":i.kind==="Deadline"?"Deadline: "+i.title:i.title;}
function endTime(i,d){
  if(i.end&&i.end>i.time)return {date:d,time:i.end};
  const [h,m]=i.time.split(":").map(Number);
  return h+1>=24?{date:addDays(d,1),time:pad(h+1-24)+":"+pad(m)}:{date:d,time:pad(h+1)+":"+pad(m)};
}
function googleUrl(i,d){
  const D=s=>s.replace(/-/g,"");let dates;
  if(i.time){const e=endTime(i,d);dates=D(d)+"T"+i.time.replace(":","")+"00/"+D(e.date)+"T"+e.time.replace(":","")+"00";}
  else dates=D(d)+"/"+D(addDays(d,1));
  const p=new URLSearchParams({action:"TEMPLATE",text:calTitle(i),dates,details:(i.label||areaName(i.area))+" · from dash-io"});
  if(i.extra)p.set("location",i.extra);
  if(i.coll==="routines"){const r=S.routines[i.id];if(r&&Array.isArray(r.days)&&r.days.length)p.set("recur","RRULE:FREQ=WEEKLY;BYDAY="+r.days.map(n=>BYDAY[n]).join(","));}
  if(i.coll==="classes"){const c=S.classes[i.id];if(c&&BYDAY[Number(c.day)])p.set("recur","RRULE:FREQ=WEEKLY;BYDAY="+BYDAY[Number(c.day)]);}
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
function outlookUrl(i,d){

const DAYNAMES=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const toMin=t=>{const p=String(t||"").split(":").map(Number);return (p[0]||0)*60+(p[1]||0);};
const fmtIn=m=>m<60?m+" min":m<1440?Math.floor(m/60)+"h"+(m%60?" "+(m%60)+"m":""):Math.floor(m/1440)+"d "+Math.floor(m%1440/60)+"h";
const fmtHrs=m=>(m/60).toFixed(m%60?1:0)+"h";
function renderTimetable(){
  const all=classes().map(c=>{const s=toMin(c.start);let e=toMin(c.end);if(e<=s)e=s+60;return Object.assign({},c,{day:Number(c.day),s,e,col:clsColor(c)});});
  const now=new Date(),wd=now.getDay(),nowM=now.getHours()*60+now.getMinutes();
  const byDay=d=>all.filter(c=>c.day===d).sort((a,b)=>a.s-b.s||a.e-b.e);
  let curC=null,next=null,nextIn=0,nextDay=0;
  byDay(wd).forEach(c=>{if(!curC&&c.s<=nowM&&nowM<c.e)curC=c;});
  for(let o=0;o<=7&&!next;o++){const d=(wd+o)%7;const c=byDay(d).find(c=>o>0||c.s>nowM);if(c){next=c;nextIn=o*1440+c.s-nowM;nextDay=d;}}
  const nowEl=document.getElementById("ttNow");
  const meta=c=>esc(c.type||"Class")+(c.room?" · "+esc(c.room):"")+" · "+esc(c.start)+"–"+esc(c.end);
  if(curC){
    const pc=Math.round((nowM-curC.s)/(curC.e-curC.s)*100);
    nowEl.style.setProperty("--a","var(--c"+curC.col+")");
    nowEl.innerHTML='<span class="beacon"></span><div style="min-width:0"><div class="eyebrow">Happening now</div><h2>'+esc(curC.title)+'</h2><div class="muted" style="font-size:12.5px">'+meta(curC)+(next?' · then '+esc(next.title)+(nextDay===wd&&nextIn<1440?' at '+esc(next.start):' on '+DAYNAMES[nextDay]):'')+'</div></div>'+
      '<div class="count">'+fmtIn(curC.e-nowM)+'<small>left</small></div><div class="bar"><i style="width:'+pc+'%"></i></div>';
  } else if(next){
    const when=nextDay===wd&&nextIn<1440?"today":nextDay===(wd+1)%7&&nextIn<2880?"tomorrow":DAYNAMES[nextDay];
    nowEl.style.setProperty("--a","var(--c"+next.col+")");
    nowEl.innerHTML='<span class="beacon still"></span><div style="min-width:0"><div class="eyebrow">Next class · '+when+'</div><h2>'+esc(next.title)+'</h2><div class="muted" style="font-size:12.5px">'+meta(next)+'</div></div>'+

  } else nowEl.innerHTML='<div class="empty" style="grid-column:1 / -1;padding:0">'+(loaded?"No classes yet. Use Import from image to read your timetable, or add classes one by one with + Class.":"Loading your timetable…")+'</div>';
  const days=[1,2,3,4,5].concat([6,0].filter(d=>all.some(c=>c.day===d)));
  let lo=480,hi=1080;all.forEach(c=>{lo=Math.min(lo,Math.floor(c.s/60)*60);hi=Math.max(hi,Math.ceil(c.e/60)*60);});
  const span=hi-lo;

  document.getElementById("tt").innerHTML=days.map((d,idx)=>{
    const list=byDay(d);const mins=list.reduce((n,c)=>n+c.e-c.s,0);
    const segs=list.map(c=>'<i class="seg" style="left:'+((c.s-lo)/span*100).toFixed(2)+'%;width:'+((c.e-c.s)/span*100).toFixed(2)+'%;background:var(--c'+c.col+')"></i>').join("");
    const tick=d===wd&&nowM>=lo&&nowM<=hi?'<b class="tick" style="left:'+((nowM-lo)/span*100).toFixed(2)+'%"></b>':"";
    const rows=list.map(c=>{
      const clash=list.some(o=>o!==c&&o.s<c.e&&c.s<o.e),live=d===wd&&c.s<=nowM&&nowM<c.e,past=d===wd&&c.e<=nowM;
      return '<button type="button" class="cls'+(past?" past":"")+'" data-act="edit" data-kind="class" data-id="'+esc(c.id)+'" style="--a:var(--c'+c.col+')" aria-label="Edit '+esc(c.title)+'">'+
        '<span class="time">'+esc(c.start)+'<small>'+esc(c.end)+'</small></span>'+
        '<span style="min-width:0"><span class="name">'+esc(c.title)+'</span><span class="sub">'+(live?'<span class="beacon"></span>':"")+'<span class="code">'+esc(c.code||"")+'</span><span class="pill plain">'+esc(c.type||"Class")+'</span>'+(clash?'<span class="pill mid">Overlaps</span>':"")+'</span></span>'+
        '<span class="room">'+esc(c.room||"")+'</span></button>';
    }).join("");
    return '<article class="day'+(d===wd?" today":"")+'" style="--i:'+idx+'"><div class="day-h"><h3>'+DAYNAMES[d]+(d===wd?' <span class="pill good">Today</span>':"")+'</h3><span class="mono muted" style="font-size:12px">'+(list.length?list.length+(list.length>1?" classes · ":" class · ")+fmtHrs(mins):"")+'</span></div>'+

  }).join("");

function renderWorkload(){
  const el=document.getElementById("idpChart"),sub=document.getElementById("idpChartSub");if(!el)return;
  const mon=addDays(TODAY,-((parse(TODAY).getDay()+6)%7));
  const weeks=[];for(let i=0;i<8;i++){const s=addDays(mon,i*7);weeks.push({s,e:addDays(s,6),t:0,m:0,ev:0});}
  const put=(d,key)=>{const w=weeks.find(w=>d>=w.s&&d<=w.e);if(w)w[key]++;};
  tasks().forEach(t=>{if(!t.done&&areaOf(t.area)==="idp"&&isDate(t.due))put(t.due,"t");});
  milestones("idp").forEach(m=>{if(m.status!=="done"&&isDate(m.due))put(m.due,"m");});
  events().forEach(e=>{if(areaOf(e.area)==="idp"&&isDate(e.date))put(e.date,"ev");});
  const tot=weeks.map(w=>w.t+w.m+w.ev),sum=tot.reduce((a,b)=>a+b,0),peak=Math.max(...tot);
  sub.textContent=sum?sum+" IDP items in the next 8 weeks · busiest is the week of "+shortDate(weeks[tot.indexOf(peak)].s):"Nothing is scheduled for IDP in the next 8 weeks.";
  const top=Math.max(3,peak),W=640,H=220,L=28,R=8,T=18,B=30,bw=(W-L-R)/8,Y=v=>T+(1-v/top)*(H-T-B);
  let g="";const step=Math.max(1,Math.ceil(top/4));for(let v=0;v<=top;v+=step){const y=Y(v).toFixed(1);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"></line><text x="'+(L-6)+'" y="'+(Number(y)+3)+'" text-anchor="end">'+v+'</text>';}
  const SEGS=[["t","var(--a)"],["m","var(--c5)"],["ev","var(--c6)"]];
  let bars="";
  weeks.forEach((w,i)=>{
    const x=L+i*bw+bw*.2,wd=bw*.6;let y=Y(0);

function renderYears(){
  const el=document.getElementById("fypSide");if(!el)return;
  const ys=refsOf("fyp").map(r=>Number(r.year)).filter(y=>y>1900&&y<3000);
  if(!ys.length){el.innerHTML='<div class="empty">Add the publication year to your references to see how recent your sources are.</div>';return;}
  const maxY=Math.max(...ys);let minY=Math.min(...ys);const older=minY<maxY-11;if(older)minY=maxY-11;
  const bins=[];for(let y=minY;y<=maxY;y++)bins.push({y,n:0});
  ys.forEach(y=>{bins[Math.max(0,y-minY)].n++;});
  const top=Math.max(...bins.map(b=>b.n)),W=320,H=150,L=6,R=6,T=16,B=22,bw=(W-L-R)/Math.max(bins.length,4),Y=v=>T+(1-v/top)*(H-T-B);
  const bars=bins.map((b,i)=>{const x=L+i*bw+bw*.15,cx=(x+bw*.35).toFixed(1);const lab=(older&&i===0?"≤":"")+"'"+String(b.y).slice(2);
    return (b.n?'<rect class="bar-b" style="--i:'+i+'" x="'+x.toFixed(1)+'" y="'+Y(b.n).toFixed(1)+'" width="'+(bw*.7).toFixed(1)+'" height="'+(Y(0)-Y(b.n)).toFixed(1)+'" rx="2" fill="var(--a)"><title>'+(older&&i===0?"Up to ":"")+b.y+": "+b.n+'</title></rect><text class="lbl" x="'+cx+'" y="'+(Y(b.n)-4).toFixed(1)+'" text-anchor="middle">'+b.n+'</text>':"")+'<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle">'+lab+'</text>';}).join("");
  const sorted=ys.slice().sort((a,b)=>a-b),med=sorted[Math.floor(sorted.length/2)],yr=new Date().getFullYear(),recent=ys.filter(y=>y>=yr-5).length;
  el.innerHTML='<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Number of references by publication year"><g class="grid"><line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0)+'" y2="'+Y(0)+'"></line></g>'+bars+'</svg></div><div class="muted" style="font-size:12.5px">Median year '+med+' · '+recent+' of '+ys.length+' from the last 5 years</div>';
}

  'Reply with only JSON like:\n{"weeks":[{"week":3,"start":"2026-09-28","title":"Literature review on sensors","summary":"Read papers on strain sensors and agreed the project scope with the supervisor.","items":[{"text":"Read 4 papers on strain gauges","cat":"research"},{"text":"Supervisor meeting on project scope","cat":"meeting"}]}]}\n\n'+

async function ingestLogbook(files){

function setupSideSwipe(){
  const side=document.getElementById("side"),scrim=document.querySelector(".scrim"),shell=document.querySelector(".shell");if(!side||!scrim||!shell)return;
  let sx=null,sy=null,dx=0,active=false,mode=null,w=290,lastX=0,lastT=0,vel=0,raf=0;
  const apply=()=>{raf=0;const off=mode==="close"?Math.min(0,dx):Math.min(0,-w+Math.max(0,dx));side.style.transform="translate3d("+off.toFixed(1)+"px,0,0)";scrim.style.opacity=String(Math.max(0,1+off/w).toFixed(3));};

    if(open&&(side.contains(e.target)||e.target===scrim))mode="close";else if(!open&&t.clientX<22)mode="open";else return;
    sx=lastX=t.clientX;sy=t.clientY;dx=0;vel=0;active=false;w=side.offsetWidth||290;lastT=performance.now();
  },{passive:true});
  document.addEventListener("touchmove",e=>{
    if(sx===null)return;const t=e.touches[0];dx=t.clientX-sx;const dy=t.clientY-sy;

    const now=performance.now();vel=((t.clientX-lastX)/Math.max(1,now-lastT))*0.7+vel*0.3;lastX=t.clientX;lastT=now;
    if(!raf)raf=requestAnimationFrame(apply);
  },{passive:true});
  const end=()=>{
    if(sx===null)return;sx=null;if(raf){cancelAnimationFrame(raf);raf=0;}if(!active)return;active=false;
    const v=performance.now()-lastT<90?vel:0;

  sampling_disabled:"Claude isn't available on this account right now. Add classes by hand with + Class.",
  images_unavailable:"Reading images isn't available here. Open the dashboard on claude.ai, or add classes with + Class.",
  image_rejected:"That file can't be read. Use a JPG, PNG or WebP screenshot under 20 MB.",

const DAYMAP={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
function normTime(t){
  const m=String(t||"").match(/(\d{1,2})\s*[:.]\s*(\d{2})\s*(am|pm)?/i);if(!m)return "";
  let h=+m[1];const mi=+m[2];
  if(m[3]){const pm=m[3].toLowerCase()==="pm";if(pm&&h<12)h+=12;if(!pm&&h===12)h=0;}
  return h>23||mi>59?"":pad(h)+":"+pad(mi);
}
function normalizeClasses(data){
  const arr=Array.isArray(data)?data:(data&&Array.isArray(data.classes)?data.classes:[]);
  return arr.map(o=>{
    if(!o||typeof o!=="object")return null;
    const d=DAYMAP[String(o.day||"").trim().slice(0,3).toLowerCase()];
    const start=normTime(o.start),end=normTime(o.end),title=String(o.title||"").trim().slice(0,120);
    if(d==null||!start||!end||end<=start||!title)return null;
    return {day:d,start,end,title,code:String(o.code||"").trim().slice(0,30),type:String(o.type||"").trim().slice(0,12),room:String(o.room||"").trim().slice(0,60),keep:true};
  }).filter(Boolean).sort((a,b)=>((a.day+6)%7)-((b.day+6)%7)||a.start.localeCompare(b.start));
}
function setImpFile(f){

  if(imp.url){try{URL.revokeObjectURL(imp.url);}catch(e){}}
  imp.file=f;imp.url=URL.createObjectURL(f);imp.rows=[];imp.status="idle";imp.msg="";renderImport();
}

}
async function readTimetable(){
  if(!imp.file||!sampleFn||imp.status==="reading")return;
  const ctl=new AbortController();imp.ctl=ctl;imp.status="reading";imp.msg="";imp.rows=[];renderImport();
  const prompt='The image is a university class timetable for one week. List every class session shown in it.\n\n'+
    'Reply with only a JSON array, one object per session, like this:\n'+
    '[{"day":"Tuesday","start":"08:00","end":"09:30","code":"NMB47403","title":"Additive Manufacturing","type":"Tut","room":"B206"}]\n\n'+
    'Rules:\n- day: full English weekday name.\n- start, end: 24-hour HH:MM.\n- code: the course code exactly as written, or "" if there is none.\n'+
    '- title: the course name as written.\n- type: Lec, Tut or Lab when the image shows lecture, tutorial or lab; otherwise the short label shown, or "".\n'+
    '- room: the room or location as written (for example ONLINE14), or "".\n- Skip days marked as having no class. Do not invent sessions.';
  try{
    const data=await sampleFn.json(prompt,{images:[imp.file],signal:ctl.signal});
    if(imp.ctl!==ctl)return;
    const rows=normalizeClasses(data);
    if(rows.length){imp.rows=rows;imp.status="done";}
    else{imp.status="error";imp.msg="No classes were found in that image. Try a clearer screenshot, or add classes with + Class.";}
  }catch(e){
    if(imp.ctl!==ctl)return;
    const c=e&&e.code;

  }
  imp.ctl=null;renderImport();
}
async function saveImport(){

  const keep=imp.rows.filter(r=>r.keep);if(!keep.length){toast("Tick at least one class to save.");return;}
  imp.status="saving";renderImport();
  if(imp.mode==="replace"){for(const id of Object.keys(S.classes))await remove("classes",id);}
  const colorOf={};
  Object.values(S.classes).forEach(c=>{if(c&&c.color)colorOf[c.code||c.title]=Number(c.color);});
  let n=Object.keys(colorOf).length;
  for(const r of keep){
    const k=r.code||r.title;if(!colorOf[k]){colorOf[k]=(n%7)+1;n++;}
    await save("classes","c-"+newId(),{title:r.title,code:r.code,type:r.type,day:r.day,start:r.start,end:r.end,room:r.room,color:colorOf[k],createdAt:new Date().toISOString()});

const unb64url=t=>{const s=atob(String(t).replace(/-/g,"+").replace(/_/g,"/"));return new TextDecoder().decode(Uint8Array.from(s,c=>c.charCodeAt(0)));};

async function spConnect(web){
  const inp=document.getElementById("spCid");if(inp)SP.cid=inp.value.trim();
  if(!/^[0-9a-f]{32}$/i.test(SP.cid)){SP.err="That doesn't look like a Spotify Client ID. It's 32 letters and numbers from your app's settings page.";renderMusic();return;}
  lsSet("dashio.sp.cid",SP.cid);
  const verifier=randStr(64),nonce=randStr(16);
  const challenge=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier)));
  const scope=web===true||spCanStream()?SP_SCOPES_WEB:SP_SCOPES;
  lsSet("dashio.sp.pkce",JSON.stringify({n:nonce,v:verifier,c:SP.cid,s:scope}));
  const q=new URLSearchParams({client_id:SP.cid,response_type:"code",redirect_uri:spRedirect(),code_challenge_method:"S256",code_challenge:challenge,scope,state:b64urlText(JSON.stringify({n:nonce,v:verifier,c:SP.cid,s:scope}))});
  location.href="https://accounts.spotify.com/authorize?"+q.toString();
}
async function spTokenReq(body){
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(body).toString()});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw {code:j.error||("http_"+r.status),message:j.error_description||""};
  return j;
}
async function spHandleRedirect(){
  if(!spCan())return;
  const q=new URLSearchParams(location.search);if(!q.has("state")||!(q.has("code")||q.has("error")))return;
  let st=null;try{st=JSON.parse(unb64url(q.get("state")));}catch(e){st=null;}
  try{history.replaceState(null,"",spRedirect()+"#music");}catch(e){}
  if(!st||!st.n)return;
  if(q.get("error")){SP.err=q.get("error")==="access_denied"?"Spotify connection was cancelled.":"Spotify said: "+q.get("error");return;}
  let local=null;try{local=JSON.parse(lsGet("dashio.sp.pkce")||"null");}catch(e){}
  const verifier=local&&local.n===st.n?local.v:st.v,cid=local&&local.n===st.n?local.c:st.c,asked=String((local&&local.n===st.n?local.s:st.s)||SP_SCOPES);

  try{
    const j=await spTokenReq({grant_type:"authorization_code",code:q.get("code"),redirect_uri:spRedirect(),client_id:cid,code_verifier:verifier});
    SP.cid=cid;lsSet("dashio.sp.cid",cid);
    SP.tok={a:j.access_token,r:j.refresh_token,e:Date.now()+(Number(j.expires_in)||3600)*1000-60000,s:String(j.scope||asked)};spSaveTok();
    SP.err="";SP.justLinked=true;SP.flash=/\bstreaming\b/.test(SP.tok.s)&&/\bstreaming\b/.test(asked)?"web":"ok";
    let standalone=false;try{standalone=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;}catch(e){}
    SP.linkNote=IS_IOS&&!standalone;
  }catch(e){SP.err=e&&e.code==="invalid_client"?"Spotify didn't accept that Client ID. Check it in your Spotify app settings.":e&&e.code==="invalid_grant"?"Spotify sign-in expired. Press Connect again.":"Couldn't finish connecting to Spotify. Check the Redirect URI in your Spotify app matches exactly, then try again.";}
}
let spRefreshing=null;
async function spToken(force){
  if(!spOn())throw {code:"not_connected"};
  if(!force&&SP.tok.a&&SP.tok.e>Date.now())return SP.tok.a;
  if(!spRefreshing)spRefreshing=(async()=>{
    try{const j=await spTokenReq({grant_type:"refresh_token",refresh_token:SP.tok.r,client_id:SP.cid});
      SP.tok={a:j.access_token,r:j.refresh_token||SP.tok.r,e:Date.now()+(Number(j.expires_in)||3600)*1000-60000,s:String(j.scope||SP.tok.s||"")};spSaveTok();return SP.tok.a;}
    catch(e){if(e&&(e.code==="invalid_grant"||e.code==="invalid_client")){SP.tok=null;spSaveTok();SP.err="Your Spotify sign-in ended. Connect again to keep seeing your music.";}throw e;}
    finally{spRefreshing=null;}
  })();
  return spRefreshing;
}
async function spApi(method,path,body,retry){
  const a=await spToken();
  const opt={method,headers:{Authorization:"Bearer "+a}};
  if(body!==undefined){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(body);}
  const r=await fetch("https://api.spotify.com/v1"+path,opt);
  if(r.status===204||r.status===202)return null;
  if(r.status===401&&!retry){await spToken(true);return spApi(method,path,body,true);}
  let j=null;const txt=await r.text().catch(()=>"");try{j=txt?JSON.parse(txt):null;}catch(e){j=null;}
  if(!r.ok){const er=j&&j.error||{};if(r.status===403&&/scope/i.test(String(er.message||"")))throw {code:"scope",reason:"",message:String(er.message||"")};throw {code:r.status===403?"forbidden":r.status===404?"not_found":r.status===429?"rate_limited":"http_"+r.status,reason:String(er.reason||""),message:String(er.message||"")};}
  return j;
}
const spGet=path=>spApi("GET",path);
const safeImg=u=>/^https:\/\/[^\s"'<>]+$/.test(String(u||""))?String(u):"";
const pickImg=(imgs,min)=>{const a=Array.isArray(imgs)?imgs.slice().sort((x,y)=>(x.width||0)-(y.width||0)):[];const i=a.find(x=>(x.width||0)>=(min||0))||a[a.length-1];return safeImg(i&&i.url);};
const spUri=u=>/^spotify:(track|episode|artist|album|playlist|show):[A-Za-z0-9]+$/.test(String(u||""))?String(u):"";
function spTrack(t){
  if(!t)return null;const ep=t.type==="episode";
  return {name:String(t.name||""),by:ep?String(t.show&&t.show.name||""):(t.artists||[]).map(a=>a.name).join(", "),album:ep?"":String(t.album&&t.album.name||""),
    img:pickImg(ep?(t.images||t.show&&t.show.images):(t.album&&t.album.images),300),thumb:pickImg(ep?(t.images||t.show&&t.show.images):(t.album&&t.album.images),60),
    url:safeImg(t.external_urls&&t.external_urls.spotify),dur:Number(t.duration_ms)||0,id:String(t.id||""),uri:spUri(t.uri)};
}
function spSetNow(p){
  if(p&&p.item){const dv=p.device||{};
    SP.data.now={t:spTrack(p.item),playing:!!p.is_playing,prog:Number(p.progress_ms)||0,at:Date.now(),shuffle:!!p.shuffle_state,repeat:String(p.repeat_state||"off"),
      dev:{id:String(dv.id||""),name:String(dv.name||""),type:String(dv.type||""),vol:dv.volume_percent==null?null:Number(dv.volume_percent),volOk:dv.supports_volume!==false}};}
  else SP.data.now=null;

async function spRefresh(full){
  if(!spOn()||SP.busy||!navigator.onLine)return;SP.busy=true;
  try{
    if(!SP.pending){const p=await spGet("/me/player?additional_types=episode");spSetNow(p);SP.lastNow=Date.now();}
    if(full||!SP.data.recent){
      const [rec,ta,tt,me]=await Promise.all([spGet("/me/player/recently-played?limit=50"),spGet("/me/top/artists?limit=12&time_range="+SP.range),spGet("/me/top/tracks?limit=10&time_range="+SP.range),SP.data.me?Promise.resolve(null):spGet("/me")]);
      SP.data.recent=(rec&&rec.items||[]).map(it=>Object.assign(spTrack(it.track)||{},{at:String(it.played_at||"")})).filter(x=>x.name);
      SP.data.topA=(ta&&ta.items||[]).map(a=>({name:String(a.name||""),img:pickImg(a.images,160),url:safeImg(a.external_urls&&a.external_urls.spotify),uri:spUri(a.uri),genres:Array.isArray(a.genres)?a.genres.slice(0,4).map(String):[]}));
      SP.data.topT=(tt&&tt.items||[]).map(spTrack).filter(Boolean);
      SP.data.range=SP.range;if(me)SP.data.me={name:String(me.display_name||me.id||""),product:String(me.product||"")};
      SP.lastFull=Date.now();
    }
    SP.data.at=Date.now();spSaveData();SP.err="";
  }catch(e){
    const c=e&&e.code;
    if(c==="scope"){}
    else if(c==="forbidden")SP.err="Spotify blocked this account. In your Spotify app's settings, open User Management and add the email of the Spotify account you signed in with.";
    else if(c==="rate_limited")SP.err="Spotify asked us to slow down. Trying again shortly.";
    else if(c!=="not_connected"&&!SP.err)SP.err="Couldn't reach Spotify right now.";

function spPaint(){if(view==="music")renderMusic();renderHeroSide();}
function spDisconnect(){if(SP.web){try{SP.web.disconnect();}catch(e){}SP.web=null;SP.webDev="";}SP.tok=null;spSaveTok();SP.data={};spSaveData();SP.err="";renderMusic();renderHeroSide();toast("Spotify disconnected on this device");}

/* open in the Spotify app (falls back to the web player only if the app didn't open) */
function spOpenApp(uri,web){
  uri=spUri(uri);web=safeImg(web);
  if(!uri){if(web)window.open(web,"_blank","noopener");return;}
  let left=false;const mark=()=>{left=true;};
  window.addEventListener("blur",mark,{once:true});document.addEventListener("visibilitychange",mark,{once:true});
  location.href=uri;
  setTimeout(()=>{window.removeEventListener("blur",mark);document.removeEventListener("visibilitychange",mark);if(!left&&!document.hidden&&web)window.open(web,"_blank","noopener");},1600);
}

/* playback control */
const SP_ERR={NO_ACTIVE_DEVICE:"No Spotify device is active. Open Spotify on your phone or computer, or pick where to play.",PREMIUM_REQUIRED:"Controlling playback needs Spotify Premium on the account you listen with.",UNKNOWN:"Spotify couldn't do that right now."};
async function spCtl(action,arg){
  if(!spCanControl()){SP.err="";spAskControl();return;}
  const n=SP.data.now;
  try{
    if(action==="toggle"){
      if(n&&n.playing){if(n)n.playing=false;spPaint();await spApi("PUT","/me/player/pause");}
      else{if(n){n.playing=true;n.at=Date.now();}spPaint();await spApi("PUT","/me/player/play"+spDevQ());}
    }
    else if(action==="next")await spApi("POST","/me/player/next"+spDevQ());
    else if(action==="prev"){if(n&&npProg()>4000){await spApi("PUT","/me/player/seek?position_ms=0");n.prog=0;n.at=Date.now();}else await spApi("POST","/me/player/previous"+spDevQ());}
    else if(action==="seek"){const ms=Math.max(0,Math.round(arg));if(n){n.prog=ms;n.at=Date.now();}spPaint();await spApi("PUT","/me/player/seek?position_ms="+ms);}
    else if(action==="shuffle"){const v=!(n&&n.shuffle);if(n)n.shuffle=v;spPaint();await spApi("PUT","/me/player/shuffle?state="+v);}
    else if(action==="repeat"){const order=["off","context","track"],v=order[(order.indexOf(n&&n.repeat||"off")+1)%3];if(n)n.repeat=v;spPaint();await spApi("PUT","/me/player/repeat?state="+v);}
    else if(action==="volume"){const v=Math.max(0,Math.min(100,Math.round(arg)));if(n&&n.dev)n.dev.vol=v;await spApi("PUT","/me/player/volume?volume_percent="+v);}
    else if(action==="play"){await spApi("PUT","/me/player/play"+spDevQ(),arg);toast("Playing");}
    SP.err="";
  }catch(e){
    if(e&&e.code==="scope"){SP.tok.noCtl=true;spSaveTok();spAskControl();return;}
    if(e&&e.code==="not_found"||e&&e.reason==="NO_ACTIVE_DEVICE"){SP.pendingPlay={action,arg};spOpenDevices(SP_ERR.NO_ACTIVE_DEVICE);return;}
    toast(e&&e.reason==="PREMIUM_REQUIRED"?SP_ERR.PREMIUM_REQUIRED:e&&e.code==="rate_limited"?"Spotify asked to slow down. Try again in a moment.":SP_ERR.UNKNOWN);
  }
  spSoon();
}
function spDevQ(){return SP.forceDev?"?device_id="+encodeURIComponent(SP.forceDev):"";}
let spSoonT=0;
function spSoon(){clearTimeout(spSoonT);SP.pending=false;spSoonT=setTimeout(()=>spRefresh(false),450);setTimeout(()=>spRefresh(false),1600);}
function spAskControl(){
  SP.needControl=true;SP.devOpen=false;renderDevSheet();
  if(view!=="music"){setView("music");try{history.replaceState(null,"","#music");}catch(e){}}
  renderMusic();try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){}
  const n=document.querySelector("#viewMusic .allow-card");if(n){n.classList.remove("pulse");void n.offsetWidth;n.classList.add("pulse");}
}
async function spPlayItem(uri,ctx){
  uri=spUri(uri);if(!uri)return;
  const body=/^spotify:(track|episode):/.test(uri)?(ctx&&ctx.length?{uris:ctx}:{uris:[uri]}):{context_uri:uri};
  if(ctx&&ctx.length&&/^spotify:(track|episode):/.test(uri)){const i=ctx.indexOf(uri);if(i>0)body.offset={position:i};}

async function spOpenDevices(msg){

  try{const j=await spGet("/me/player/devices");if(false)throw 0;SP.devs=(j&&j.devices||[]).map(d=>({id:String(d.id||""),name:String(d.name||""),type:String(d.type||""),active:!!d.is_active,restricted:!!d.is_restricted}));}

const DEV_IC={Computer:"💻",Smartphone:"📱",Tablet:"📱",Speaker:"🔊",TV:"📺",AVR:"🔊",CastAudio:"🔊",CastVideo:"📺",Automobile:"🚗",GameConsole:"🎮"};
function renderDevSheet(){

  if(!el){el=document.createElement("div");el.id="devSheet";el.className="dev-sheet";el.setAttribute("role","dialog");el.setAttribute("aria-label","Choose where to play");document.body.appendChild(el);}
  el.classList.remove("closing");
  const devs=SP.devs,web=webPlayable();

  if(devs===null)list='<div class="empty"><span class="reading"><i></i><i></i><i></i></span> Looking for your devices…</div>';
  else{
    list=devs.filter(d=>d.id&&d.id!==SP.webDev).map(d=>'<button type="button" class="dev'+(d.active?" on":"")+'" data-act="sp-dev" data-id="'+esc(d.id)+'"'+(d.restricted?" disabled":"")+'><span class="dev-ic">'+(DEV_IC[d.type]||"🎵")+'</span><span><b>'+esc(d.name||"Device")+'</b><small>'+esc(d.type)+(d.active?" · playing here":"")+(d.restricted?" · can't be controlled":"")+'</small></span>'+(d.active?eqHtml(SP.data.now&&SP.data.now.playing):"")+'</button>').join("");

    if(!devs.filter(d=>d.id!==SP.webDev).length)list+='<div class="muted" style="font-size:13px;padding:4px 2px">No other devices found. Open the Spotify app on your phone or computer and play anything for a second, then refresh.</div>';
  }

    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" type="button" data-act="sp-open-app" data-uri="'+esc((SP.data.now&&SP.data.now.t&&SP.data.now.t.uri)||"spotify:")+'">Open the Spotify app</button><button class="btn small ghost" type="button" data-act="sp-dev-refresh">↻ Refresh</button></div></div>';
}
async function spTransfer(id,play){
  try{await spApi("PUT","/me/player",{device_ids:[id],play:play!==false});SP.forceDev="";if(SP.tok.noCtl){SP.tok.noCtl=false;spSaveTok();}

    SP.devOpen=false;renderDevSheet();toast("Switched device");spSoon();}
  catch(e){if(e&&e.code==="scope"){SP.tok.noCtl=true;spSaveTok();SP.devOpen=false;renderDevSheet();spAskControl();return;}toast(e&&e.reason==="PREMIUM_REQUIRED"?SP_ERR.PREMIUM_REQUIRED:"Couldn't switch to that device. Open Spotify on it first.");}
}
/* in-browser player (Spotify Web Playback SDK, computers only) */
function spWebStart(){
  if(SP.web&&SP.webDev){spTransfer(SP.webDev,true);return;}
  if(!webPlayable()){toast("This browser can't play Spotify. Use the Spotify app.");return;}
  if(!spCanStream()){SP.devOpen=false;renderDevSheet();SP.askWeb=true;spAskControl();return;}
  SP.webState="loading";renderDevSheet();
  const boot=()=>{
    try{
      const pl=new window.Spotify.Player({name:"dash-io",getOAuthToken:cb=>{spToken().then(cb).catch(()=>{});},volume:0.7});
      SP.web=pl;
      pl.addListener("ready",({device_id})=>{SP.webDev=device_id;SP.webState="ready";renderDevSheet();spTransfer(device_id,true);});
      pl.addListener("not_ready",()=>{SP.webState="";});
      const fail=m=>()=>{SP.webState="error";SP.webErr=m;renderDevSheet();toast(m);};
      pl.addListener("initialization_error",fail("This browser can't play Spotify. Use the Spotify app."));
      pl.addListener("authentication_error",()=>{SP.webState="error";SP.webErr="Allow playing in this browser";SP.askWeb=true;spAskControl();});
      pl.addListener("account_error",fail("Playing in the browser needs Spotify Premium."));
      pl.addListener("player_state_changed",st=>{if(!st||!st.track_window||!st.track_window.current_track)return;const t=st.track_window.current_track;
        SP.data.now=Object.assign({},SP.data.now||{},{t:spTrack(Object.assign({},t,{type:t.type||"track",external_urls:{spotify:"https://open.spotify.com/track/"+(t.id||"")}})),playing:!st.paused,prog:Number(st.position)||0,at:Date.now(),shuffle:!!st.shuffle,repeat:["off","context","track"][st.repeat_mode]||"off",dev:{id:SP.webDev,name:"This browser (dash-io)",type:"Computer",vol:SP.data.now&&SP.data.now.dev&&SP.data.now.dev.id===SP.webDev?SP.data.now.dev.vol:70,volOk:true}});
        spPaint();});
      pl.connect();
    }catch(e){SP.webState="error";SP.webErr="Couldn't start the player.";renderDevSheet();}
  };
  if(window.Spotify&&window.Spotify.Player){boot();return;}
  window.onSpotifyWebPlaybackSDKReady=boot;
  loadScript("https://sdk.scdn.co/spotify-player.js").catch(()=>{SP.webState="error";SP.webErr="Couldn't load the Spotify player. Check your connection.";renderDevSheet();});
}

const msFmt=ms=>{const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+":"+pad(s%60);};
const ago=iso=>{const m=Math.round((Date.now()-Date.parse(iso))/60000);return !isFinite(m)?"":m<1?"now":m<60?m+"m ago":m<1440?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago";};

async function spAct(a,b){
  if(a==="sp-connect")spConnect().catch(()=>{SP.err="Couldn't start the Spotify sign-in.";renderMusic();});
  else if(a==="sp-allow"){b.disabled=true;b.textContent="Opening Spotify…";spConnect(b.dataset.web==="1").catch(()=>{SP.err="Couldn't start the Spotify sign-in.";renderMusic();});}
  else if(a==="sp-allow-no"){SP.askWeb=false;renderMusic();}
  else if(a==="sp-disconnect"){if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Press again to disconnect";setTimeout(()=>{if(b.isConnected){b.dataset.armed="";b.textContent="Disconnect";}},3000);return;}spDisconnect();}
  else if(a==="sp-refresh"){toast("Refreshing…");spRefresh(true);}
  else if(a==="sp-more"){ui.spAll=!ui.spAll;renderMusic();}
  else if(a==="sp-range"){SP.range=b.dataset.r;lsSet("dashio.sp.range",SP.range);renderMusic();spRefresh(true);}
  else if(a==="sp-copy-ru"){try{await navigator.clipboard.writeText(spRedirect());toast("Redirect URI copied");}catch(e){toast("Select the address and copy it");}}
  else if(a==="sp-copy"){if(!spOn())return;const code="dio1."+b64urlText(JSON.stringify({c:SP.cid,r:SP.tok.r,s:SP.tok.s||""}));try{await navigator.clipboard.writeText(code);toast("Link code copied. Paste it in the other dash-io.");}catch(e){prompt("Copy this link code:",code);}}
  else if(a==="sp-link"){
    const v=(document.getElementById("spLink")||{}).value||"";
    try{const o=JSON.parse(unb64url(v.trim().replace(/^dio1\./,"")));if(!o||!o.c||!o.r)throw 0;SP.cid=o.c;lsSet("dashio.sp.cid",o.c);SP.tok={a:"",r:o.r,e:0,s:String(o.s||"")};spSaveTok();SP.err="";renderMusic();await spRefresh(true);if(spOn())toast("Spotify connected");}
    catch(e){SP.err="That link code didn't work. Copy it again from the other screen.";renderMusic();}
  }
  else if(a==="sp-ctl")spCtl(b.dataset.c);
  else if(a==="sp-play"){
    if(SP.web&&IS_IOS===false){try{SP.web.activateElement&&SP.web.activateElement();}catch(e){}}
    const uri=b.dataset.uri,n=SP.data.now;
    if(n&&n.t&&n.t.uri===uri){spCtl("toggle");return;}
    const ctx=b.dataset.ctx==="top"?(SP.data.topT||[]).map(t=>t.uri).filter(Boolean):null;
    spPlayItem(uri,ctx);
  }
  else if(a==="sp-play-top"){const u=(SP.data.topT||[]).map(t=>t.uri).filter(Boolean);if(u.length)spCtl("play",{uris:u});}
  else if(a==="sp-open-app")spOpenApp(b.dataset.uri,b.dataset.web||(SP.data.now&&SP.data.now.t&&SP.data.now.t.url)||"");
  else if(a==="sp-devs"){if(!spCanControl()){spAskControl();return;}spOpenDevices("");}
  else if(a==="sp-dev-close"){SP.devOpen=false;SP.pendingPlay=null;renderDevSheet();}
  else if(a==="sp-dev-refresh")spOpenDevices(SP.devMsg);
  else if(a==="sp-dev")spTransfer(b.dataset.id,true);
  else if(a==="sp-dev-web"){if(SP.web&&SP.web.activateElement){try{SP.web.activateElement();}catch(e){}}spWebStart();}
}

function goalChartHtml(p){

    '<path class="area" d="'+area+'"></path>'+pace+'<path class="ln" pathLength="1" d="'+line+'"></path>'+
    pts.slice(1,-1).map(q=>'<circle class="pt" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.5"></circle>').join("")+
    '<circle class="end" cx="'+pts[pts.length-1][0].toFixed(1)+'" cy="'+pts[pts.length-1][1].toFixed(1)+'" r="5.5"></circle>'+
    '<line class="today" x1="'+tX+'" x2="'+tX+'" y1="'+T+'" y2="'+(H-B)+'"></line>'+
    '<text x="'+L+'" y="'+(H-8)+'">'+shortDate(start)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+shortDate(end)+'</text><text class="lbl-today" x="'+tX+'" y="'+(H-8)+'" text-anchor="middle">Today</text></svg>'+
    '<div class="ch-legend"><span><i style="background:var(--a)"></i>Your progress</span>'+(pace?'<span><i style="background:var(--muted)"></i>Pace to reach it on time</span>':"")+'</div>';
